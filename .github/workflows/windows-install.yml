# تجربة التركيب على ويندوز: نفس اللي يسويه كلود عند المتابع (install.sh ثم setup.sh ثم تشغيل وإيقاف)، من Git Bash.
# يدوي: gh workflow run windows-install.yml
name: windows-install
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      # الملفات لازم توصل ببايتاتها (الاستوديو يفحص بصمة كل ملف): بدون هذا ويندوز يبدّل نهايات الأسطر عند السحب
      - name: keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # (a follower's machine gets Python 3.12 from winget through 00_setup.sh; the runner has no winget)
      # 3.10 and 3.11 are for «the voice tools when an older Python comes first» (GitHub #5): the image no longer has them
      # (run 42201824712, 1.0.24: its first line ended 2). 3.12, the last one, stays every step's default python.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
      - name: ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: engine measurement m7 (1.0.26) — CPU decode of wedding-camera kinds of footage, the camera file against today's conf.mkv, and rule ب frame by frame with this ffmpeg (info)
        timeout-minutes: 25
        run: |
          set +e
          mkdir -p "$HOME/m7"
          cat > "$HOME/m7-reader.mjs" <<'JS'
          // m7 (the same script runs on the Windows runner and, for calibration, on the Mac): the export reader's decode cost per
          // exported frame on the CPU only (no VideoToolbox, as on Windows), the camera file (new path, rule ب) against today's
          // conf.mkv; framemd5: the conf decodes to the fps filter's frames, and the fps filter's frame m is source frame k(m).
          // usage: node m7-reader.mjs <workdir> [ffmpeg]   (makes its clips in <workdir>, deletes them at the end)
          import fs from 'node:fs';
          import path from 'node:path';
          import os from 'node:os';
          import { spawn, spawnSync } from 'node:child_process';
          const [work, FF = 'ffmpeg'] = process.argv.slice(2);
          fs.mkdirSync(work, { recursive: true });
          const win = process.platform === 'win32';
          const ver = spawnSync(FF, ['-version'], { encoding: 'utf8' }).stdout.split('\n')[0];
          console.log(`M7 machine: ${process.platform} ${os.cpus().length} cores (${os.cpus()[0]?.model}), ${Math.round(os.totalmem() / 2 ** 30)} GB, ${ver}`);
          const ff = (args) => { const t = performance.now(); const r = spawnSync(FF, ['-nostdin', '-hide_banner', '-v', 'error', '-y', ...args], { encoding: 'utf8', maxBuffer: 1 << 30 });
            if (r.status !== 0) throw new Error(r.stderr.slice(-600)); return performance.now() - t; };
          // the export reader's arguments (export.mjs readerArgs, 1.0.24, no hardware decode): every decoded frame once, RGB to the pipe
          const GAIN = "lutrgb=r='min(65535\\,floor(val*1.0038601167225771+0.5))':g='min(65535\\,floor(val*1.0038601167225771+0.5))':b='min(65535\\,floor(val*1.0038601167225771+0.5))'";
          const readerArgs = (file, deep) => ['-nostdin', '-hide_banner', '-loglevel', 'error', '-threads', '4', '-i', file, '-map', '0:v:0', '-an', '-sn', '-dn', '-vf',
            'scale=in_color_matrix=bt709:in_range=tv:flags=accurate_rnd+full_chroma_int+full_chroma_inp,' + (deep ? 'format=rgb48le,' + GAIN : 'format=rgba'),
            '-fps_mode', 'passthrough', '-f', 'rawvideo', 'pipe:1'];
          function readAll(file, w, h, deep) {
            return new Promise((res, rej) => {
              const bytes = w * h * (deep ? 6 : 4); const t = performance.now(); let got = 0, first = null;
              const p = spawn(FF, readerArgs(file, deep), { stdio: ['ignore', 'pipe', 'pipe'], windowsHide: true }); let err = '';
              p.stdout.on('data', (c) => { got += c.length; if (first === null && got >= bytes) first = performance.now() - t; });
              p.stderr.on('data', (d) => { err += d; });
              p.on('close', (code) => code === 0 ? res({ ms: performance.now() - t, frames: Math.floor(got / bytes), firstMs: first }) : rej(new Error(err.slice(-600))));
            });
          }
          const md5s = (file) => fs.readFileSync(file, 'utf8').split('\n').filter((l) => l && !l.startsWith('#')).map((l) => l.split(',').pop().trim());
          const kOf = (S, P, m) => Math.ceil((S[0] * P[1] * (2 * m + 1)) / (2 * S[1] * P[0]) - 1e-9) - 1;
          const CASES = [
            // three wedding-camera kinds of footage, made here: 6 s each, at such cameras' bitrates; the temporal noise is set (measured on the Mac,
            // 6 Nov) so the lossless conf of each weighs per frame what real files of those cameras do (3.9, 1.25 and 2.7 MB), and every frame differs
            { name: '4K 59.94 HEVC 10-bit (Pocket 4K60) -> 29.97', w: 3840, h: 2160, S: [60000, 1001], P: [30000, 1001], pix: 'yuv420p10le', prof: 'main10', kbps: 95000, noise: 8, deep: true },
            { name: '1080 47.95 HEVC 10-bit (Pocket 1080p48) -> 29.97', w: 1920, h: 1080, S: [48000, 1001], P: [30000, 1001], pix: 'yuv420p10le', prof: 'main10', kbps: 36000, noise: 6, deep: true },
            { name: '4K 29.97 HEVC 8-bit (drone) -> 30', w: 3840, h: 2160, S: [30000, 1001], P: [30, 1], pix: 'yuv420p', prof: 'main', kbps: 94000, noise: 6, deep: false },
          ];
          const rows = [];
          for (const c of CASES) {
            const src = path.join(work, 'src.mp4'), conf = path.join(work, 'src.conf.mkv');
            const encMs = ff(['-f', 'lavfi', '-i', `testsrc2=size=${c.w}x${c.h}:rate=${c.S[0]}/${c.S[1]}:duration=6`, '-vf', `noise=alls=${c.noise}:allf=t,format=${c.pix}`,
              '-c:v', 'libx265', '-preset', 'ultrafast', '-profile:v', c.prof, '-x265-params', `bitrate=${c.kbps}:vbv-maxrate=${c.kbps}:vbv-bufsize=${c.kbps}:keyint=30:min-keyint=30:bframes=0:log-level=error`,
              '-tag:v', 'hvc1', src]);
            // today's import of this file: conformTo exactly (Windows: ultrafast; the Mac: medium)
            const confMs = ff(['-i', src, '-map', '0:v:0', '-an', '-vf', `setpts=PTS-STARTPTS,fps=${c.P[0]}/${c.P[1]}`, '-c:v', 'libx264', '-qp', '0',
              '-preset', win ? 'ultrafast' : 'medium', '-pix_fmt', c.pix, '-f', 'matroska', conf]);
            const runs = [];
            for (let i = 0; i < 2; i++) {
              const a = await readAll(conf, c.w, c.h, c.deep), b = await readAll(src, c.w, c.h, c.deep);
              runs.push({ confMsPerExported: +(a.ms / a.frames).toFixed(1), sourceMsPerExported: +(b.ms / a.frames).toFixed(1), confFrames: a.frames, sourceFrames: b.frames });
            }
            // frames: the conf's decode = the fps filter (lossless), and the filter's frame m = source frame k(m) (rule ب)
            const fa = path.join(work, 'a.md5'), fb = path.join(work, 'b.md5'), fc = path.join(work, 'c.md5');
            ff(['-i', src, '-map', '0:v:0', '-vf', `format=${c.pix}`, '-fps_mode', 'passthrough', '-f', 'framemd5', fa]);
            ff(['-i', src, '-map', '0:v:0', '-vf', `setpts=PTS-STARTPTS,fps=${c.P[0]}/${c.P[1]},format=${c.pix}`, '-fps_mode', 'passthrough', '-f', 'framemd5', fb]);
            ff(['-i', conf, '-map', '0:v:0', '-vf', `format=${c.pix}`, '-fps_mode', 'passthrough', '-f', 'framemd5', fc]);
            const s = md5s(fa), f = md5s(fb), cd = md5s(fc);
            let rule = 0, lossless = 0; for (let m = 0; m < f.length; m++) { if (f[m] === s[Math.min(kOf(c.S, c.P, m), s.length - 1)]) rule++; if (cd[m] === f[m]) lossless++; }
            const best = (k) => Math.min(...runs.map((r) => r[k]));
            const ratio = +(best('sourceMsPerExported') / best('confMsPerExported')).toFixed(2);
            const row = { case: c.name, sourceMB: +(fs.statSync(src).size / 2 ** 20).toFixed(1), confMB: +(fs.statSync(conf).size / 2 ** 20).toFixed(1), confMBPerFrame: +(fs.statSync(conf).size / 2 ** 20 / runs[0].confFrames).toFixed(2),
              encodeS: +(encMs / 1000).toFixed(1), conformS: +(confMs / 1000).toFixed(1), runs, ratio, uniqueSource: new Set(s).size, sourceFrames: s.length,
              ruleFrames: `${rule}/${f.length}`, losslessFrames: `${lossless}/${f.length}` };
            rows.push(row);
            console.log('M7 case', JSON.stringify(row));
            for (const x of [src, conf, fa, fb, fc]) fs.rmSync(x, { force: true });
          }
          const worst = Math.max(...rows.map((r) => r.ratio));
          // Mac calibration (6 Nov, CPU only): on real files of those cameras the same ratio was up to 1.6x the made clips' (4K60 0.76 vs 0.58,
          // 1080p48 0.73 vs 0.45, drone 0.68 vs 0.63), so the decision reads the worst ratio times 1.6
          const est = +(worst * 1.6).toFixed(2);
          console.log(`M7 RESULT: source/conf decode per exported frame, worst ${worst}x on the made clips, about ${est}x for real footage ` +
            `(${rows.map((r) => `${r.case.split(' (')[0]}: ${r.ratio}x`).join('; ')}). ` +
            `Rule frames ${rows.map((r) => r.ruleFrames).join(', ')}; lossless ${rows.map((r) => r.losslessFrames).join(', ')}. ` +
            (est > 1.5 ? 'Over 1.5x: by answer 3, Windows keeps copying (conf) on CPU-only machines.' : 'Within 1.5x: the new path holds on Windows.'));
          fs.rmSync(work, { recursive: true, force: true });
          JS
          node "$HOME/m7-reader.mjs" "$(cygpath -w "$HOME/m7")" ffmpeg; echo "m7 exit $?"
          rm -f "$HOME/m7-reader.mjs"
          exit 0
      - name: install the two skills
        run: bash "ملفات لكلود/install.sh"
      - name: setup check (before) (info)
        run: bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" || echo "check exit $?"
      - name: setup install, everything at once (1.0.16) — the montage tools, the studio, its sound tools, the transcription model
        # 11: tools just installed that this shell cannot see (on a follower's machine: Claude closed and opened); once more.
        # (audit 1.0.19, P11) GitHub runs bash -eo pipefail: set +e, or the first exit 11 ends the step before the retry
        run: |
          set +e
          bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install; rc=$?
          if [ $rc -eq 11 ]; then bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install; rc=$?; fi
          echo "setup exit $rc"
          exit $rc
      - name: everything came with it — the montage skill's Python, its transcriber, the model on the disk
        run: |
          # (the first of the two places that has it: ls of a missing one fails the step under pipefail)
          MPY=""; for c in "$HOME/Documents/video-edit/tools/py/Scripts/python.exe" /c/EditStudio/tools/py/Scripts/python.exe; do [ -x "$c" ] && { MPY="$c"; break; }; done
          echo "montage python: $MPY"
          [ -n "$MPY" ]
          "$MPY" -c "import faster_whisper, av; print('faster-whisper', faster_whisper.__version__, 'PyAV', av.__version__)"
          "$MPY" "$HOME/Documents/video-edit/studio/app/studio/tools/np/model_fetch.py" --has && echo "the model is there"
          echo "$MPY" > "$HOME/mpy.txt"
          bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh"
      - name: the noise cleaner for real (DPDFNet in the studio Python, the model from the package)
        run: |
          D="$HOME/Documents/video-edit/studio"
          PY="$D/py/Scripts/python.exe"
          "$PY" "$D/app/studio/voice/denoise.py" --version --models "$D/app/studio/voice/dpdfnet"
          ffmpeg -v error -y -f lavfi -i "sine=frequency=220:duration=3" -f lavfi -i "anoisesrc=color=pink:duration=3:amplitude=0.05" -filter_complex "[0:a][1:a]amix=inputs=2:normalize=0,pan=stereo|c0=c0|c1=c0" -ar 48000 -c:a pcm_f32le noisy.wav
          "$PY" "$D/app/studio/voice/denoise.py" noisy.wav clean.wav --models "$D/app/studio/voice/dpdfnet"
          "$PY" "$D/app/studio/voice/dereverb.py" noisy.wav wpe.wav
          "$PY" -c "import soundfile as sf; a=sf.info('noisy.wav'); b=sf.info('clean.wav'); print(a.frames, b.frames, b.channels, b.subtype); assert a.frames == b.frames and b.channels == 2"
      - name: the voice tools when an older Python comes first (GitHub #5, 1.0.24) — Python 3.10 first on the PATH, no montage venv to fall back on, the studio's voice venv on 3.11 with packages that import (Astra on fix-reports, item 3: import-only readiness kept it); setup.sh --install builds it again from 3.12 and DPDFNet loads, never pip's «dpdfnet==0.6.0 not found»
        # the follower's machine: dpdfnet 0.6.0 is one wheel for Python >= 3.11 (numpy 2.5.4 needs 3.12) and the venv came from
        # the first python found. The montage venv (3.12 here) is put aside for the step, or it would be taken and hide the case
        run: |
          D="$HOME/Documents/video-edit/studio"; M="$HOME/Documents/video-edit/tools/py"
          OLD="$(ls -d /c/hostedtoolcache/windows/Python/3.10.*/x64 2>/dev/null | tail -1)"
          V311="$(ls -d /c/hostedtoolcache/windows/Python/3.11.*/x64 2>/dev/null | tail -1)"
          echo "older pythons: $OLD | $V311"; [ -x "$OLD/python.exe" ] && [ -x "$V311/python.exe" ]
          mv "$D/py" "$D/py.good"; mv "$M" "$M.aside"
          "$V311/python.exe" -m venv "$(cygpath -w "$D/py")"
          # its packages import (older ones would): the readiness that only imported kept this venv and never rebuilt it
          for m in dpdfnet nara_wpe soundfile numpy cv2 PIL; do mkdir -p "$D/py/Lib/site-packages/$m"; : > "$D/py/Lib/site-packages/$m/__init__.py"; done
          "$D/py/Scripts/python.exe" -c "import platform, dpdfnet, nara_wpe, soundfile, numpy, cv2, PIL; print('voice venv before:', platform.python_version(), '(its packages import)')"
          set +e
          PATH="$OLD:$OLD/Scripts:$PATH" bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install --no-montage --no-app > setup5.txt 2>&1; rc=$?
          set -e
          mv "$M.aside" "$M"
          cat setup5.txt; echo "setup exit $rc"
          if grep -q "dpdfnet==0.6.0" setup5.txt; then echo "FAILED: pip's «dpdfnet not found» again"; exit 1; fi
          "$D/py/Scripts/python.exe" -c "import sys, platform, dpdfnet; print('voice venv after:', platform.python_version()); assert sys.version_info >= (3, 12)"
          "$D/py/Scripts/python.exe" "$D/app/studio/voice/denoise.py" --version --models "$D/app/studio/voice/dpdfnet"
          if ls -d "$D"/py.old-* >/dev/null 2>&1; then echo "FAILED: the old venv was left behind"; exit 1; fi
          rm -rf "$D/py.good"
          # setup.sh ends with the doctor's verdict, and this step put the montage venv aside on purpose: with Python 3.10 first
          # on the PATH the transcriber is missing by construction (run 42203279676: «✗ Python 3.10.11 … بلا أداة التفريغ», exit 1).
          # That line may be setup's one problem, nothing else may; and with the montage venv back the doctor must be clean.
          if [ $rc -ne 0 ]; then
            [ $rc -eq 1 ] && [ "$(grep -c '^✗' setup5.txt)" = 1 ] && grep -q '^✗ Python .*بلا أداة التفريغ' setup5.txt \
              || { echo "FAILED: setup exit $rc, and not only the transcriber this step put aside"; exit 1; }
          fi
          bash "$D/app/scripts/doctor.sh"
      - name: a real Python 3.15 for the next step (python.org's newest, not put on the PATH)
        id: py315
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          update-environment: false
      - name: the voice tools when the only Python is newer than they install on (hotfix after 1.0.24) — python.org's 3.15 first on the PATH, a launcher that knows no 3.12 to 3.14, no montage venv; setup.sh --install names the range and builds nothing from 3.15, the voice venv comes back as it was
        # a follower who installed the newest Python from python.org: its installer puts it on the PATH and registers it with
        # the py launcher, alone. The runner's own Pythons (the tool cache) are taken off the PATH for this step, a `py` that
        # knows only 3.15 stands before the real launcher, and the montage venv (3.12) is put aside, or it would be taken
        run: |
          P315="${{ steps.py315.outputs.python-path }}"
          [ -n "$P315" ] || { echo "FAILED: no Python 3.15 on this runner (setup-python said: ${{ steps.py315.outcome }}): the case is NOT covered"; exit 1; }
          P315D="$(dirname "$(cygpath -u "$P315")")"
          "$P315D/python.exe" -c "import sys; print('python.org stand-in:', sys.version.split()[0]); assert sys.version_info[:2] >= (3, 15)"
          D="$HOME/Documents/video-edit/studio"; M="$HOME/Documents/video-edit/tools/py"
          mkdir -p "$HOME/py315only"
          printf '#!/bin/bash\ncase "$1" in -3.15|-3) shift; exec "%s" "$@";; *) echo "No suitable Python runtime found" >&2; exit 103;; esac\n' "$P315D/python.exe" > "$HOME/py315only/py"
          chmod +x "$HOME/py315only/py"
          NOPY="$(printf '%s' "$PATH" | tr ':' '\n' | grep -vi '/hostedtoolcache/windows/python/' | paste -sd: -)"
          PATH="$HOME/py315only:$P315D:$P315D/Scripts:$NOPY" bash -c 'for v in 3.12 3.13 3.14; do py -$v -V >/dev/null 2>&1 && { echo "the launcher still knows $v"; exit 1; }; done; type -aP python python3; python -V'
          mv "$D/py" "$D/py.good"; mv "$M" "$M.aside"
          set +e
          PATH="$HOME/py315only:$P315D:$P315D/Scripts:$NOPY" bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install --no-montage --no-app > setup315.txt 2>&1; rc=$?
          set -e
          mv "$M.aside" "$M"
          cat setup315.txt; echo "setup exit $rc (its doctor counts the transcriber put aside here: by construction)"
          ok=1
          grep -q 'تحتاج Python من 3.12 إلى 3.14، والموجود على الجهاز 3.15' setup315.txt || { echo "FAILED: no line naming the range and the 3.15 it found"; ok=0; }
          if grep -qiE 'onnxruntime|No matching distribution|dpdfnet==' setup315.txt; then echo "FAILED: pip ran on 3.15"; ok=0; fi
          if [ -e "$D/py" ]; then echo "FAILED: a voice venv was built: $("$D/py/Scripts/python.exe" -V 2>&1)"; rm -rf "$D/py"; ok=0; fi
          if ls -d "$D"/py.old-* >/dev/null 2>&1; then echo "FAILED: an old venv was left beside it"; ok=0; fi
          mv "$D/py.good" "$D/py"
          "$D/py/Scripts/python.exe" -c "import platform, dpdfnet; print('voice venv back as it was:', platform.python_version())"
          [ $ok = 1 ]
          bash "$D/app/scripts/doctor.sh"
      - name: the face tool the montage skill installed on Windows (mediapipe 0.10.21), from its own Python — its detector loads and runs on a frame
        # (audit 1.0.19, P6) it used to pip-install mediapipe into the runner's Python and import it there, which passed even when
        # the skill's install had left it out; now nothing is installed here, and the studio's «face» below reads the same venv
        run: |
          "$(cat "$HOME/mpy.txt")" -c "import mediapipe as m, numpy as np, cv2; d = m.solutions.face_detection.FaceDetection(model_selection=1); r = d.process(np.zeros((480, 640, 3), np.uint8)); d.close(); print('mediapipe', m.__version__, 'OpenCV', cv2.__version__, '| faces on an empty frame:', len(r.detections or [])); assert m.__version__ == '0.10.21', m.__version__"
      - name: montage skill, setup check (what it says is missing on this machine) (info)
        run: bash "$HOME/.claude/skills/video-edit/scripts/00_setup.sh" || echo "check exit $?"
      - name: start, status, info
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          bash "$S/start.sh" --no-open
          bash "$S/studio.sh" status
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          curl -s -m 30 "${URL}api/info" > info.json
          cut -c1-200 info.json; echo
          # الاستوديو المركّب يشوف كاشف الوجه على ويندوز (فتطلع أزرار الوجه)
          python -c "import json; d=json.load(open('info.json', encoding='utf-8')); print('platform', d.get('platform'), 'face', d.get('face')); assert d.get('face') is True"
      - name: a studio with no pack (1.0.27) — the install makes no packs folder and lists none; a stand-in piece put in <data>/home/packs is read by the server, listed and its files served (only from inside it); once it goes, the studio lists none again
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          D="$HOME/Documents/video-edit/studio"
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          test ! -e "$D/home/packs" || { echo "FAILED: the install made $D/home/packs"; exit 1; }
          test "$(curl -s -m 30 "${URL}api/packs")" = '{"pieces":[]}' || { echo "FAILED: a pack is listed with none installed"; exit 1; }
          test "$(curl -s -m 30 -o /dev/null -w '%{http_code}' "${URL}packs/demo/piece.mjs")" = 404
          # a stand-in piece (generic: one template, its words, a file of its own)
          mkdir -p "$D/home/packs/demo/fonts"
          printf '%s\n' '{"id": "demo", "version": "1", "needs": "1.0.27", "name": {"ar": "تجربة", "en": "Demo"}}' > "$D/home/packs/demo/piece.json"
          printf '%s\n' "export default function demo(api) { api.templates({ code: 'function draw(g, t, k) {}', defs: [{ id: 'demo-title', nameKey: 'x.demo.title', dur: 3, fields: [{ key: 'title', labelKey: 'tpl.f.title', max: 40 }] }] }); api.strings({ ar: { 'x.demo.title': 'تجربة' }, en: { 'x.demo.title': 'Demo' } }); }" > "$D/home/packs/demo/piece.mjs"
          printf 'x' > "$D/home/packs/demo/fonts/demo.ttf"
          bash "$S/studio.sh" stop
          bash "$S/start.sh" --no-open
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          curl -s -m 30 "${URL}api/packs" > packs.json
          cat packs.json; echo
          # used: the server imported it itself (a Windows path made a file URL)
          python -c "import json; d=json.load(open('packs.json', encoding='utf-8')); assert [(p['id'], p['entry'], p['used']) for p in d['pieces']] == [('demo', '/packs/demo/piece.mjs', True)], d"
          test "$(curl -s -m 30 -o /dev/null -w '%{http_code}' "${URL}packs/demo/piece.mjs")" = 200
          test "$(curl -s -m 30 -o /dev/null -w '%{http_code}' "${URL}packs/demo/fonts/demo.ttf")" = 200
          test "$(curl -s -m 30 -o /dev/null -w '%{http_code}' "${URL}packs/demo/piece.json")" = 404
          test "$(curl -s -m 30 -o /dev/null -w '%{http_code}' "${URL}packs/demo/fonts/..%5C..%5Cpiece.json")" != 200
