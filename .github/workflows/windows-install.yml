          cat > "$HOME/offset_rule.mjs" <<'JS'
          // the rule on this machine: the installed studio's encodeCheck, files made with this machine's ffmpeg (as test/unit/encode-offset.test.mjs)
          import fs from 'node:fs'; import os from 'node:os'; import path from 'node:path'; import { spawnSync } from 'node:child_process'; import { pathToFileURL } from 'node:url';
          const E = await import(pathToFileURL(process.env.EXPORT_MJS).href);
          const W = 96, H = 64, N = 12, AT = 6, TO_420 = 'scale=in_range=pc:out_range=tv:out_color_matrix=bt709:flags=accurate_rnd+full_chroma_int,format=yuv420p';
          const ff = (args, input) => { const r = spawnSync('ffmpeg', ['-nostdin', '-v', 'error', ...args], { input, maxBuffer: 1 << 26, timeout: 60000 }); if (r.status !== 0) throw new Error(String(r.stderr)); return r.stdout; };
          const to420 = (rgba) => ff(['-f', 'rawvideo', '-pix_fmt', 'rgba', '-s', `${W}x${H}`, '-i', 'pipe:0', '-vf', TO_420, '-f', 'rawvideo', 'pipe:1'], rgba);
          const noisy = (yuv, amp) => { const b = Buffer.from(yuv); for (let i = 0; i < W * H; i += 7) b[i] = Math.max(16, Math.min(235, b[i] + ((i / 7) & 1 ? amp : -amp))); return b; };
          const still = () => { const b = Buffer.alloc(W * H * 4); for (let i = 0; i < W * H; i++) { const x = i % W, y = (i / W) | 0, bar = x >= 20 && x < 77 && y >= 28 && y < 34; b[4 * i] = bar ? 255 : 40 + y; b[4 * i + 1] = bar ? 32 : 40 + y; b[4 * i + 2] = bar ? 32 : 40 + y; b[4 * i + 3] = 255; } return b; };
          const moving = (f) => { const b = Buffer.alloc(W * H * 4); for (let i = 0; i < W * H; i++) { const x = i % W, y = (i / W) | 0, bar = x >= 6 * f && x < 6 * f + 12; b[4 * i] = bar ? 220 : 50 + x; b[4 * i + 1] = bar ? 200 : 60 + y; b[4 * i + 2] = bar ? 180 : 70; b[4 * i + 3] = 255; } return b; };
          let bad = 0;
          const say = (ok, what, row) => { console.log(`${ok ? 'ok    ' : 'FAILED'} ${what}: ${JSON.stringify(row)}`); if (!ok) bad++; };
          async function rows(pics, yuvs, near) {
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'offset-rule-'));
            try {
              fs.mkdirSync(path.join(dir, 'check'));
              fs.writeFileSync(path.join(dir, 'check', `${AT}.rgba`), pics[AT]);
              for (const k of [AT - 1, AT + 1]) { if (near === 'rgba') fs.writeFileSync(path.join(dir, 'check', `${k}.rgba`), pics[k]); if (near === 'yuv') fs.writeFileSync(path.join(dir, 'check', `${k}.yuv`), to420(pics[k])); }
              const file = path.join(dir, 'f.mp4');
              ff(['-y', '-f', 'rawvideo', '-pix_fmt', 'yuv420p', '-s', `${W}x${H}`, '-framerate', '30', '-i', 'pipe:0', '-c:v', 'libx264', '-qp', '0', '-pix_fmt', 'yuv420p', file], Buffer.concat(yuvs));
              return (await E.encodeCheck({ outPath: file, renderDir: dir, check: new Set([AT]), f0: 0, f1: N, W, H }))[0];
            } finally { fs.rmSync(dir, { recursive: true, force: true }); }
          }
          const S = Array.from({ length: N }, () => still()), sy = to420(S[0]);
          const same = S.map((_, f) => noisy(sy, f === AT ? 2 : 1));
          for (const near of ['rgba', 'yuv']) {
            const r = await rows(S, same, near);
            say(r.next > r.psnr + E.OFFSET_MARGIN_DB && r.psnr >= E.ENCODE_MIN_DB, `the case itself (${near}): a neighbour cleaner by more than ${E.OFFSET_MARGIN_DB} dB`, r);
            say(r.aligned === true, `the same picture beside frame n, encoded cleaner (${near}): not an offset`, r);
          }
          const r0 = await rows(S, same, null);
          say(r0.aligned === false, 'without the neighbours\' pictures: the old rule (refused)', r0);
          const M = Array.from({ length: N }, (_, f) => moving(f)), my = M.map((p) => noisy(to420(p), 1));
          for (const near of ['rgba', 'yuv']) {
            say((await rows(M, my, near)).aligned === true, `moving content in place (${near})`, '');
            for (const [name, list] of [['late', [my[0], ...my.slice(0, N - 1)]], ['early', [...my.slice(1), my[N - 1]]]]) {
              const r = await rows(M, list, near);
              say(r.aligned === false, `a one-frame offset of moving content, ${name} (${near}): refused`, r);
            }
          }
          // 1.0.25 (Astra 2 on fix-hotfix): the picture repeated on one side of the check frame (footage at half the timeline's
          // rate, a still after a cut): file frame n ± 1 matches both pictures alike, so file frame n itself must show its own
          const flat = (v) => { const b = Buffer.alloc(W * H * 4, v); for (let i = 3; i < b.length; i += 4) b[i] = 255; return b; };
          const A = flat(100), B = flat(102);
          for (const near of ['rgba', 'yuv']) {
            const lateP = Array.from({ length: N }, (_, f) => (f < AT ? A : B)), earlyP = Array.from({ length: N }, (_, f) => (f <= AT ? A : B));
            say((await rows(lateP, lateP.map(to420), near)).aligned === true, `a picture repeated on one side, in place (${near})`, '');
            const rl = await rows(lateP, [lateP[0], ...lateP.slice(0, N - 1)].map(to420), near);
            say(rl.aligned === false, `a picture repeated on one side, one frame late (${near}): refused`, rl);
            const re = await rows(earlyP, [...earlyP.slice(1), earlyP[N - 1]].map(to420), near);
            say(re.aligned === false, `a picture repeated on one side, one frame early (${near}): refused`, re);
          }
          process.exit(bad ? 1 : 0);
