          // a stand-in for claude or codex (its folder's name says which): records how it was started in <WHY_BIN>/why-log.jsonl and
          // answers as the real one. The studio gives its children only a few variables, so nothing here comes from the environment
          // but CODEX_HOME (which it passes on).
          const fs = require('fs'), path = require('path');
          const a = process.argv.slice(2), as = /codex/.test(path.basename(__dirname)) ? 'codex' : 'claude';
          const BASE = path.resolve(__dirname, '..', '..', '..', '..');
          const log = (o) => fs.appendFileSync(path.join(BASE, 'why-log.jsonl'), JSON.stringify({ as, ...o }) + '\n');
          const out = (o) => process.stdout.write(JSON.stringify(o) + '\n');
          if (a[0] === '--version') { console.log(as === 'codex' ? 'codex-cli 0.163.0' : '2.1.295 (Claude Code)'); process.exit(0); }
          if (as === 'claude' && a[0] === 'auth') { console.log(JSON.stringify({ loggedIn: true, email: 'ci@example.com', subscriptionType: 'max' })); process.exit(0); }
          if (as === 'codex' && a[0] === 'login') { console.error('Logged in using ChatGPT'); process.exit(0); }
          let stdin = '', over = false;
          process.stdin.setEncoding('utf8');
          process.stdin.on('data', (d) => { stdin += d; });
          process.stdin.on('end', done);
          function done() {
            if (over) return; over = true;
            log({ argv: a, stdin });
