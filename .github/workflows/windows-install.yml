      - name: the words through the studio on Windows (1.0.17) — «مقطع جديد» gives the sentences, and «فرّغ الكلام الآن» on a clip by hand gives the words
        # followers on Windows: «ما تطلع الجمل ولا الكابشن». The steps above run the transcriber alone; this one goes the way they
        # do, through the studio (analyze for «اختر الجمل», POST /api/cut/transcribe for the captions button), with the model the
        # install brought. The voice is English (the machine's own), so the language is set to English for it
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          D="$HOME/Documents/video-edit/studio"
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          powershell -NoProfile -Command "Add-Type -AssemblyName System.Speech; \$s = New-Object System.Speech.Synthesis.SpeechSynthesizer; \$s.Rate = -1; \$s.SetOutputToWaveFile('$(cygpath -w "$HOME/words.wav")'); \$s.Speak('Hello, this is the studio on Windows. Today we try the sentences and the captions.'); \$s.Dispose()"
          ffmpeg -nostdin -v error -y -i "$HOME/words.wav" -f lavfi -i testsrc2=size=360x640:rate=30 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 48000 "$HOME/words.mp4"
          PYTHONIOENCODING=utf-8 python -c "import json, os; f=os.path.join(r'$(cygpath -w "$D/home")', 'prefs.json'); p=json.load(open(f, encoding='utf-8')) if os.path.exists(f) else {}; p.setdefault('transcribe', {})['language'] = 'en'; json.dump(p, open(f, 'w', encoding='utf-8'), ensure_ascii=False); print('prefs', p['transcribe'])"
          VIDEO="$(cygpath -w "$HOME/words.mp4")" URL="$URL" PYTHONIOENCODING=utf-8 python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          url, video = os.environ['URL'], os.environ['VIDEO']
          def call(path, body=None, timeout=60):
              req = urllib.request.Request(url + path, data=None if body is None else json.dumps(body).encode('utf-8'),
                                           headers={'content-type': 'application/json'}, method='GET' if body is None else 'POST')
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode('utf-8') or '{}')
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode('utf-8') or '{}')
              except (urllib.error.URLError, TimeoutError, ConnectionError) as e:
                  return 0, {'error': str(e)}
          def cut(folder):
              return call('x/' + urllib.parse.quote(folder) + '/api/cut')
          def until(folder, done, what, secs):
              t0, last, c = time.time(), 0, {}
              while time.time() - t0 < secs:
                  st, c = cut(folder)
                  if st == 200 and done(c):
                      return c
                  if st == 200 and c.get('state') == 'stalled':
                      raise SystemExit(f'{what}: the preparation stopped: ' + json.dumps(c, ensure_ascii=False)[:1500])
                  if st == 200 and c.get('hearFail'):
                      raise SystemExit(f'{what}: the hearing failed: ' + json.dumps(c, ensure_ascii=False)[:1500])
                  if time.time() - last > 30:
                      last = time.time(); print(f'  {what}: {int(last - t0)} s', c.get('state'), c.get('step'), c.get('pct'), flush=True)
                  time.sleep(2)
              raise SystemExit(f'{what}: not done in {secs} s: ' + json.dumps(c, ensure_ascii=False)[:1500])
          def start(name, mode):
              st, j = call('api/raw/start', {'path': video, 'name': name, 'mode': mode, 'face': 'none'})
              print('start', mode, st, json.dumps(j, ensure_ascii=False))
              assert st == 202 and j.get('folder'), j
              return j['folder']
          # 1 «مقطع جديد», the whole montage: the sentences come for «اختر الجمل»
          t0 = time.time()
          f1 = start('جمل ويندوز', 'full')
          c = until(f1, lambda c: c.get('state') == 'ready', 'the sentences', 1200)
          said = [i['text'] for i in c.get('islands', []) if i.get('text', '').strip()]
          print(f'sentences after {int(time.time() - t0)} s:', len(said), json.dumps(said, ensure_ascii=False), '| heard', c.get('heard'))
          assert said, 'no sentences: ' + json.dumps(c, ensure_ascii=False)[:1500]
          # 2 by hand, then «فرّغ الكلام الآن»: the words the captions get
          t0 = time.time()
          f2 = start('كابشن ويندوز', 'manual')
          until(f2, lambda c: c.get('state') == 'noWords', 'the clip by hand', 300)
          st, j = call('x/' + urllib.parse.quote(f2) + '/api/cut/transcribe', {})
          print('transcribe', st, j)
          assert st == 202, j
          c = until(f2, lambda c: c.get('state') == 'ready' and (c.get('heard') or {}).get('words', 0) > 0, 'the words', 1200)
          said = [i['text'] for i in c.get('islands', []) if i.get('text', '').strip()]
          print(f'words after {int(time.time() - t0)} s:', c.get('heard'), json.dumps(said, ensure_ascii=False))
          assert (c.get('heard') or {}).get('ok') is True, c.get('heard')
          PY
      - name: Arabic speech on Windows with the default settings (audit 1.0.19, P3) — a generated Arabic clip through «فرّغ الكلام الآن», and the words are Arabic
        # the steps above hear the machine's English voice with the language set to English; followers speak Arabic with the
        # default language. The clip (.github/test/arabic-speech.mp3) is ElevenLabs' voice «Saad», never the author's voice:
        # «مرحبا، هذا اختبار التفريغ العربي في الاستوديو على ويندوز. نجرب الجمل والكابشن.»
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          D="$HOME/Documents/video-edit/studio"
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          ffmpeg -nostdin -v error -y -i "$GITHUB_WORKSPACE/.github/test/arabic-speech.mp3" -f lavfi -i testsrc2=size=360x640:rate=30 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 48000 "$HOME/arabic.mp4"
          # the default language again: the step above set English for its English voice
          PYTHONIOENCODING=utf-8 python -c "import json, os; f=os.path.join(r'$(cygpath -w "$D/home")', 'prefs.json'); p=json.load(open(f, encoding='utf-8')) if os.path.exists(f) else {}; p.get('transcribe', {}).pop('language', None); json.dump(p, open(f, 'w', encoding='utf-8'), ensure_ascii=False); print('prefs', p.get('transcribe'))"
          VIDEO="$(cygpath -w "$HOME/arabic.mp4")" URL="$URL" PYTHONIOENCODING=utf-8 python - <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request
          url, video = os.environ['URL'], os.environ['VIDEO']
          def call(path, body=None, timeout=60):
              req = urllib.request.Request(url + path, data=None if body is None else json.dumps(body).encode('utf-8'),
                                           headers={'content-type': 'application/json'}, method='GET' if body is None else 'POST')
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode('utf-8') or '{}')
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode('utf-8') or '{}')
              except (urllib.error.URLError, TimeoutError, ConnectionError) as e:
                  return 0, {'error': str(e)}
          def until(folder, done, what, secs):
              t0, last, c = time.time(), 0, {}
              while time.time() - t0 < secs:
                  st, c = call('x/' + urllib.parse.quote(folder) + '/api/cut')
                  if st == 200 and done(c):
                      return c
                  if st == 200 and (c.get('state') == 'stalled' or c.get('hearFail')):
                      raise SystemExit(f'{what}: stopped: ' + json.dumps(c, ensure_ascii=False)[:1500])
                  if time.time() - last > 30:
                      last = time.time(); print(f'  {what}: {int(last - t0)} s', c.get('state'), c.get('step'), c.get('pct'), flush=True)
                  time.sleep(2)
              raise SystemExit(f'{what}: not done in {secs} s: ' + json.dumps(c, ensure_ascii=False)[:1500])
          t0 = time.time()
          st, j = call('api/raw/start', {'path': video, 'name': 'عربي ويندوز', 'mode': 'manual', 'face': 'none'})
          print('start', st, json.dumps(j, ensure_ascii=False))
          assert st == 202 and j.get('folder'), j
          f = j['folder']
          until(f, lambda c: c.get('state') == 'noWords', 'the clip by hand', 300)
          st, j = call('x/' + urllib.parse.quote(f) + '/api/cut/transcribe', {})
          assert st == 202, j
          # done as soon as the studio says how the hearing went (a failure comes back «ready» with heard.ok false and its reason)
          c = until(f, lambda c: c.get('state') == 'ready' and 'ok' in (c.get('heard') or {}), 'the words', 1200)
          said = ' '.join(i['text'] for i in c.get('islands', []) if i.get('text', '').strip())
          print(f'words after {int(time.time() - t0)} s:', c.get('heard'), said)
          assert (c.get('heard') or {}).get('ok') is True and c['heard'].get('words', 0) > 0, c.get('heard')
          # Arabic: most words in Arabic letters, and words of the sentence that was said
          words = said.split()
          arabic = [w for w in words if re.search('[\u0600-\u06FF]', w)]
          assert words and len(arabic) >= 0.8 * len(words), 'not Arabic: ' + said
          hits = [w for w in ('مرحبا', 'اختبار', 'التفريغ', 'العربي', 'ويندوز', 'الجمل', 'الكابشن') if w in said]
          print('words of the sentence heard:', hits)
          assert len(hits) >= 3, 'the sentence said is not there: ' + said
          PY
      - name: data safety on Windows (1.0.21) — prefs.json held open by another program is never written over, saves leave no tmp, an export takes its name only once muxed, a broken clip comes back, a second server on the same projects is refused
        # audit 1.0.19 batch C (D3, D2, D4, D1, D8) on the studio as installed, the clip «مقطع جديد» made above
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          D="$HOME/Documents/video-edit/studio"
          export URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')" DATA="$(cygpath -w "$D")" CLIP='تجربة ويندوز' SERVER="$(cygpath -w "$D/app/studio/server.mjs")" PYTHONIOENCODING=utf-8
          cat > "$HOME/data_check.py" <<'PY'
          import json, os, shutil, subprocess, sys, urllib.error, urllib.parse, urllib.request
          # batch C (1.0.21) on the studio as installed: URL = the running studio, DATA = its data folder (home/, projects/),
          # CLIP = the clip «مقطع جديد» made above, SERVER = its server.mjs. One mode per call (the step runs them in order).
          url, D, clip = os.environ['URL'], os.environ['DATA'], os.environ['CLIP']
          home, projects = os.path.join(D, 'home'), os.path.join(D, 'projects')
          prefs = os.path.join(home, 'prefs.json')
          def call(path, body=None, method=None, raw=None, ctype='application/json', timeout=120):
              data = raw if raw is not None else (None if body is None else json.dumps(body).encode('utf-8'))
              req = urllib.request.Request(url + path, data=data, headers={'content-type': ctype}, method=method or ('GET' if data is None else 'POST'))
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode('utf-8') or '{}')
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode('utf-8') or '{}')
          q = lambda f: 'x/' + urllib.parse.quote(f)
          read = lambda f: open(f, 'rb').read()
          def write(f, b):
              with open(f, 'wb') as h: h.write(b)
          mode = sys.argv[1]

          if mode == 'prefs-prep':
              # D3: every setting he has stays; a marker shows it
              p = json.loads(read(prefs).decode('utf-8')) if os.path.exists(prefs) else {}
              p['ciKeep'] = 'every setting stays'
              write(prefs, json.dumps(p, ensure_ascii=False).encode('utf-8'))
              print('prefs.json:', p)

          elif mode == 'prefs-held':
              # D3: another program holds prefs.json (open with no sharing): an ordinary write is refused with why, never {}+change
              st, j = call('api/hints', {'seen': 'plan'}, 'PUT')
              print('a hint press while prefs.json is held:', st, json.dumps(j, ensure_ascii=False))
              assert st == 409 and j.get('error') == 'prefs.err.unreadable' and (j.get('vars') or {}).get('why'), j

          elif mode == 'prefs-after':
              p = json.loads(read(prefs).decode('utf-8'))
              assert p.get('ciKeep') == 'every setting stays', 'written over: %r' % p
              good = read(prefs)
              write(prefs, good[:25])                                   # half written (a cut write): refused too
              st, j = call('api/hints', {'seen': 'plan'}, 'PUT')
              print('a hint press on a half-written prefs.json:', st, json.dumps(j, ensure_ascii=False))
              assert st == 409 and j.get('error') == 'prefs.err.unreadable', j
              assert read(prefs) == good[:25], 'written over'
              write(prefs, good)
              st, j = call('api/hints', {'seen': 'plan'}, 'PUT')
              assert st == 200, j
              assert json.loads(read(prefs).decode('utf-8')).get('ciKeep') and json.loads(read(prefs + '.bak').decode('utf-8')).get('ciKeep'), 'prefs.json or its .bak lost a setting'
              print('readable again: written, the last good file kept as prefs.json.bak')

          elif mode == 'saves':
              # D2: five saves in a row, each through a tmp of its own synced to the disk: none left beside project.json
              st, g = call(q(clip) + '/api/project')
              assert st == 200, g
              rev, p = g['rev'], g['project']
              for i in range(5):
                  p.setdefault('meta', {})['ciSaves'] = i
                  st, r = call(q(clip) + '/api/project', {'baseRev': rev, 'clientId': 'ci', 'project': p}, 'PUT')
                  assert st == 200, r
                  rev = r['rev']
              left = [f for f in os.listdir(os.path.join(projects, clip)) if f.endswith('.tmp')]
              print('5 saves, rev', rev, '| tmp files left:', left)
              assert not left, left

          elif mode == 'export':
              # D4: the mux writes «<name>.mp4.part» and the file takes its name once it is through (Windows: renameRetry)
              name = 'تصدير ويندوز'
              st, j = call(q(clip) + '/api/export', {'name': name, 'range': [0, 6]})
              assert st == 200, j
              job = j['jobId']
              st, info = call(q(clip) + '/api/export/' + job)
              frame = bytes([90]) * (info['W'] * info['H'] * 4)
              for n in range(6):
                  st, r = call(q(clip) + '/api/export/%s/frame?n=%d' % (job, n), raw=frame, ctype='application/octet-stream')
                  assert st == 200, r
              st, d = call(q(clip) + '/api/export/%s/done' % job, {}, timeout=600)
              print('export:', st, json.dumps({k: d.get(k) for k in ('file', 'verify', 'error', 'vars')}, ensure_ascii=False))
              assert st == 200, d
              out = os.listdir(os.path.join(projects, clip, 'out'))
              print('out/:', out)
              assert name + '.mp4' in out and not [f for f in out if f.endswith('.part')], out

          elif mode == 'broken':
              # D1: a copy of the clip with its project.json cut (what a crash can leave) is a broken card, and comes back
              copy = 'تجربة تالفة'
              dst = os.path.join(projects, copy)
              shutil.rmtree(dst, ignore_errors=True)
              shutil.copytree(os.path.join(projects, clip), dst, ignore=shutil.ignore_patterns('out', 'render'))
              hist = os.path.join(dst, '.history')
              snaps = [f for f in os.listdir(hist) if f.startswith('project-')] if os.path.isdir(hist) else []
              assert snaps, 'no snapshot in .history to come back to'
              write(os.path.join(dst, 'project.json'), read(os.path.join(dst, 'project.json'))[:200])
              st, lst = call('api/projects')
              e = next((x for x in lst.get('projects', []) if x.get('folder') == copy), None)
              print('the library:', json.dumps(e, ensure_ascii=False))
              assert e and e.get('broken') and e['broken'].get('good'), 'not a broken card with its good copy'
              st, r = call('api/projects/%s/restore-good' % urllib.parse.quote(copy), {})
              print('«رجّع آخر نسخة سليمة»:', st, json.dumps(r, ensure_ascii=False))
              assert st == 200 and r.get('ok'), r
              st, pr = call(q(copy) + '/api/project')
              assert st == 200 and pr['project']['spine'], pr
              assert os.path.exists(os.path.join(dst, *r['kept'].split('/'))), 'the broken file was not kept'
              st, lst = call('api/projects')
              assert not next(x for x in lst['projects'] if x['folder'] == copy).get('broken')

          elif mode == 'second':
              # D8: a second server on the same projects folder ends at once (exit 1) and names the running one
              r = subprocess.run([shutil.which('node'), os.environ['SERVER'], '--root', projects, '--port', '0'], capture_output=True, encoding='utf-8',
                                 timeout=60, env={**os.environ, 'MOHRER_HOME': home, 'MOHRER_MODEL_FETCH': '0'})
              said = (r.stdout + r.stderr).strip()
              print('a second server on the same projects:', r.returncode, said[:400])
              assert r.returncode == 1 and url.rstrip('/') in said, 'not refused'

          elif mode == 'crash-leave':
              # D4 + D5: what a crash leaves (an export cut mid-mux, a job's render folder)
              c = os.path.join(projects, clip)
              os.makedirs(os.path.join(c, 'render', 'xcidead000'), exist_ok=True)
              write(os.path.join(c, 'render', 'xcidead000', 'video.mp4'), b'encoded video')
              write(os.path.join(c, 'out', 'بعد الانهيار.mp4.part'), b'half a file')
              print('left:', os.listdir(os.path.join(c, 'out')), os.listdir(os.path.join(c, 'render')))

          elif mode == 'crash-after':
              c = os.path.join(projects, clip)
              st, _ = call(q(clip) + '/api/project')
              assert st == 200
              out, render = os.listdir(os.path.join(c, 'out')), os.listdir(os.path.join(c, 'render'))
              print('after the start:', out, render)
              assert 'بعد الانهيار.mp4.part' not in out and 'xcidead000' not in render, 'not cleared'
              assert 'تصدير ويندوز.mp4' in out, 'a real export went'

          else:
              raise SystemExit('mode? ' + mode)
          print('PASSED', mode)
          PY
          C="$(cygpath -w "$HOME/data_check.py")"
          python "$C" prefs-prep
          # D3: prefs.json held open with no sharing (as an antivirus or a sync tool can) while the studio writes a setting
          rm -f "$HOME/prefs-held"
          powershell -NoProfile -Command "\$f = [System.IO.File]::Open('$(cygpath -w "$D/home/prefs.json")', 'Open', 'ReadWrite', 'None'); New-Item -ItemType File '$(cygpath -w "$HOME/prefs-held")' | Out-Null; Start-Sleep -Seconds 20; \$f.Close()" &
          HOLD=$!
          for i in $(seq 1 30); do [ -f "$HOME/prefs-held" ] && break; sleep 1; done
          test -f "$HOME/prefs-held"
          python "$C" prefs-held
          wait $HOLD
          python "$C" prefs-after
          python "$C" saves
          python "$C" export
          python "$C" broken
          python "$C" second
      - name: a page that is uploading, recording or exporting is never taken (1.0.21) — a chat's switch waits as a card, his own switch keeps a working page on «stay», a second window says the studio is busy and why
        # audit 1.0.19 D6 + D9, in Chrome driven by puppeteer-core (installed by the close-guard step above)
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          B="$(bash -c ". '$S/_common.sh'; app_browser_win")"
          [ -d "$HOME/pp/node_modules/puppeteer-core" ] || npm install --prefix "$HOME/pp" --no-save --no-audit --no-fund puppeteer-core@25.11.0 >/dev/null
          cat > "$HOME/busy_check.cjs" <<'JS'
          // D6 + D9 on this machine: the studio as installed, the clip «مقطع جديد» made above, in Chrome (puppeteer-core). An upload
          // held in the page (ui/close-guard.js holdOpen, what a recording or an export does too): a chat's «open another clip»
          // waits as a card, his own switch lets nothing go before Chrome asks, and a second window says the studio is busy
          const pptr = require(process.env.PP);
          const url = process.env.URL, folder = process.env.FOLDER;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          (async () => {
            const b = await pptr.launch({ executablePath: process.env.CHROME, headless: true, args: ['--no-first-run', '--no-default-browser-check'] });
            const fail = async (why) => { console.error('FAILED:', why); await b.close(); process.exit(1); };
            try {
              const at = `${url}?p=${encodeURIComponent(folder)}&test=1&guard=1`;
              const open = async () => {
                const p = await b.newPage();
                await p.setViewport({ width: 1280, height: 760 });
                await p.goto(at, { waitUntil: 'domcontentloaded' });
                await p.waitForFunction(() => window.__mohrer && window.__mohrer.ready === true, { timeout: 90000 });
                return p;
              };
              const state = (p) => p.evaluate(() => ({ released: !!window.__mohrer.ctx.released, away: !!document.querySelector('.tab-away'), stream: !window.__mohrer.ctx.stream.closed }));
              const lines = (p) => p.evaluate(() => [...document.querySelectorAll('.toast')].map((x) => x.textContent).join(' | '));
              const page = await open();
              await page.mouse.click(640, 740);                // Chrome asks only on a page he has used
              await page.evaluate(async () => { const { holdOpen } = await import('/js/ui/close-guard.js'); window.__letGo = holdOpen('upload'); });
              const asked = [];
              page.on('dialog', (d) => { asked.push(d.type()); d.dismiss().catch(() => {}); });   // «stay»
              // 1 a chat opens another clip while the upload runs (his hand not the reason: no hold time)
              await page.evaluate(() => { window.__mohrer.ctx.openHoldMs = 0; window.__mohrer.ctx.events.dispatchEvent(new CustomEvent('open', { detail: { folder: 'another-clip' } })); });
              await sleep(1500);
              let s = await state(page);
              console.log('a chat\'s switch during an upload:', JSON.stringify({ asked, ...s }), '|', await lines(page));
              if (asked.length || s.released || !s.stream) return fail('the chat took the page');
              // 2 a second window of the studio
              const p2 = await open();
              for (let i = 0; i < 80 && !(await p2.$('.tab-away')); i++) await sleep(100);
              const sheet = await p2.evaluate(() => (document.querySelector('.tab-away') || {}).textContent || '');
              s = await state(page);
              console.log('the second window:', sheet, '| the first:', JSON.stringify(s));
              if (!/مشغول/.test(sheet) || !/تُرفع/.test(sheet)) return fail('the second window did not say the studio is busy and why');
              if (s.released || s.away) return fail('the first window stepped aside during the upload');
              await p2.close();
              // 3 his own switch during the upload: Chrome asks first, and «stay» keeps a page that works
              await page.evaluate(() => { window.__mohrer.ctx.openProject('another-clip'); });
              for (let i = 0; i < 80 && !asked.length; i++) await sleep(100);
              await sleep(800);
              s = await state(page);
              console.log('his own switch:', JSON.stringify({ asked, ...s }));
              if (asked[0] !== 'beforeunload' || s.released || !s.stream) return fail('«stay» left a page with nothing working');
              await page.evaluate(() => window.__letGo());
              await b.close();
              console.log('PASSED');
            } catch (e) { await fail(e && e.stack || e); }
          })();
          JS
          PP="$(cygpath -w "$HOME/pp/node_modules/puppeteer-core")" CHROME="$(cygpath -w "$B")" URL="$URL" FOLDER='تجربة ويندوز' PYTHONIOENCODING=utf-8 node "$(cygpath -w "$HOME/busy_check.cjs")"
          taskkill //F //IM chrome.exe >/dev/null 2>&1 || true
          taskkill //F //IM msedge.exe >/dev/null 2>&1 || true
      - name: after a crash on Windows (1.0.21) — an export cut mid-mux and a job's render folder are cleared when the studio starts again, a real export stays
        # audit 1.0.19 D4 + D5: what a crash leaves is put there, the studio stopped and started as the desktop icon does
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          D="$HOME/Documents/video-edit/studio"
          export URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')" DATA="$(cygpath -w "$D")" CLIP='تجربة ويندوز' PYTHONIOENCODING=utf-8
          C="$(cygpath -w "$HOME/data_check.py")"
          python "$C" crash-leave
          bash "$S/studio.sh" stop
          bash "$S/start.sh" --no-open
          export URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          python "$C" crash-after
      - name: desktop shortcut
        shell: pwsh
        run: |
          $l = Join-Path $HOME "Desktop/B Studio.lnk"
          if (!(Test-Path $l)) { throw "no shortcut on the desktop" }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($l)
          "target: $($s.TargetPath)"; "icon: $($s.IconLocation)"
