              const line = 'Claude AI usage limit reached|1893456000';
              out({ type: 'system', subtype: 'init', session_id: 'why-1', model: 'claude-sonnet-5-5' });
              out({ type: 'assistant', uuid: 'u1', message: { content: [{ type: 'text', text: line }] } });
              out({ type: 'result', subtype: 'success', is_error: true, result: line });
              return process.stdout.write('', () => process.exit(1));
            }
            // codex exec: a picture in <CODEX_HOME>/generated_images/<thread>/
            const dir = path.join(process.env.CODEX_HOME, 'generated_images', 'why-thread');
            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(path.join(dir, 'ig_1.png'), Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg==', 'base64'));
            out({ type: 'thread.started', thread_id: 'why-thread' });
            out({ type: 'turn.completed', usage: {} });
            process.stdout.write('', () => process.exit(0));
