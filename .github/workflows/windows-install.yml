  # ── audit 1.0.19 P5 (1.0.22): a follower on an older public version updates the way they do ──
  update-from-old:
    # an older public release (OLD: 1.0.16, the first «one install»), as published (this repository's history), with a
    # clip, its caption colour, a named version, a folder holding it and a setting; then «حدّث الاستوديو» as Claude runs it:
    # update.sh brings this repository's main, setup.sh --install puts the new studio in place. Nothing may be lost
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OLD: '1.0.16'
    defaults:
      run:
        shell: bash
    steps:
      - name: keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # (this job is about a follower's data, not a bare machine: the clean-machine job does that)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: the old version installed, as it was published
        run: |
          C="$(git log --format=%H -1 --grep="^B Studio ${OLD}\$")"
          echo "B Studio $OLD: $C"
          test -n "$C"
          O="$(cygpath -u "$RUNNER_TEMP")/old"
          git worktree add "$O" "$C"
          grep -q "\"version\": \"${OLD}\"" "$O/ملفات لكلود/edit-studio/manifest.json"
          bash "$O/ملفات لكلود/install.sh"
          set +e
          bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install; rc=$?
          if [ $rc -eq 11 ]; then bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install; rc=$?; fi
          echo "setup exit $rc"
          exit $rc
      - name: a follower's data on the old version — a clip, its caption colour, a named version, a folder holding it, a setting
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          bash "$S/start.sh" --no-open
          ST="$(bash "$S/studio.sh" status)"; echo "$ST"
          ffmpeg -nostdin -v error -y -f lavfi -i testsrc2=size=360x640:rate=30:duration=6 -f lavfi -i "sine=f=220:d=6" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$HOME/old-clip.mp4"
          cat > "$HOME/update_data.py" <<'PY'
          import hashlib, json, os, sys, time, urllib.error, urllib.parse, urllib.request
          # P5 (audit 1.0.19): a follower's data across an update from an older public version. `make` on the OLD studio: a clip
          # made from a video, its caption colour changed, a named version, a folder holding it, a setting in prefs.json; everything
          # written down in SNAP. `check` on the NEW studio, after the follower's own update (update.sh, then setup.sh --install):
          # the studio is the new version, and every one of those is still there, as it was.
          # env: URL (the running studio), DATA (its data folder), NOW (its version, studio.sh status), SNAP (the file kept between the two),
          # VIDEO (make), WANT (check: the version the update must bring)
          url, D, snap = os.environ['URL'].rstrip('/'), os.environ['DATA'], os.environ['SNAP']
          home, projects = os.path.join(D, 'home'), os.path.join(D, 'projects')
          prefs = os.path.join(home, 'prefs.json')
          CLIP, FOLDER, VERSION, COLOUR = 'مقطع قديم', 'سلسلة قديمة', 'قبل التحديث', '#00FF88'


          def call(path, body=None, method=None, timeout=120):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(url + path, data=data, headers={'content-type': 'application/json'}, method=method or ('GET' if data is None else 'POST'))
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode('utf-8') or '{}')
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode('utf-8') or '{}')


          q = lambda f: '/x/' + urllib.parse.quote(f)
          digest = lambda f: hashlib.sha256(open(f, 'rb').read()).hexdigest()[:16]


          def state():
              """What a follower would miss: the library, the clip's edit and versions, its folder, every setting."""
              st, lib = call('/api/projects')
              assert st == 200, lib
              entry = next((p for p in lib.get('projects', []) if p.get('name') == CLIP or p.get('folder') == CLIP), None)
              assert entry, 'the clip is not in the library: ' + json.dumps(lib, ensure_ascii=False)[:600]
              folder = entry['folder']
              st, pr = call(q(folder) + '/api/project')
              assert st == 200, pr
              p = pr['project']
              st, vs = call(q(folder) + '/api/versions')
              names = sorted(v.get('name') or '' for v in (vs.get('versions') if isinstance(vs, dict) else vs) or [])
              st, fo = call('/api/folders')                      # {folders: [{id, name}], of: {project folder: folder id}}
              of = fo.get('of') or {}
              folders = {f.get('name'): sorted(k for k, v in of.items() if v == f.get('id')) for f in fo.get('folders') or []}
              media = {}
              for a in p.get('assets', {}).values():
                  for k in ('master', 'file'):
                      f = a.get(k)
                      if f and os.path.exists(os.path.join(projects, folder, f)):
                          media[f] = digest(os.path.join(projects, folder, f))
              return {'folder': folder, 'in': entry.get('in'), 'spine': len(p.get('spine', [])), 'colour': ((p.get('captions') or {}).get('style') or {}).get('active'),
                      'versions': names, 'folders': folders, 'media': media,
                      'prefs': json.load(open(prefs, encoding='utf-8-sig')) if os.path.exists(prefs) else {}}


          def subset(old, new, at='prefs'):
              """every key of old is in new with the same value (a newer version may add its own)"""
              if isinstance(old, dict):
                  assert isinstance(new, dict), f'{at}: was an object, now {new!r}'
                  for k, v in old.items():
                      assert k in new, f'{at}.{k}: lost'
                      subset(v, new[k], f'{at}.{k}')
              else:
                  assert old == new, f'{at}: {old!r} → {new!r}'


          mode = sys.argv[1]
          if mode == 'make':
              print('the old studio:', os.environ.get('NOW'))
              st, j = call('/api/raw/start', {'path': os.environ['VIDEO'], 'name': CLIP, 'mode': 'manual', 'face': 'none'})
              print('start', st, json.dumps(j, ensure_ascii=False))
              assert st == 202 and j.get('folder'), j
              folder = j['folder']
              for _ in range(300):
                  st, lib = call('/api/projects')
                  e = next((p for p in lib.get('projects', []) if p.get('folder') == folder), None)
                  if e and e.get('status') != 'preparing' and e.get('phase') != 'running':
                      break
                  time.sleep(1)
              else:
                  raise SystemExit('the clip never got ready')
              st, cur = call(q(folder) + '/api/project')
              pj = cur['project']
              pj.setdefault('captions', {}).setdefault('style', {})['active'] = COLOUR
              st, r = call(q(folder) + '/api/project', {'baseRev': cur['rev'], 'clientId': 'ci', 'label': 'ci', 'project': pj}, 'PUT')
              assert st == 200, r
              st, r = call(q(folder) + '/api/versions', {'name': VERSION})
              print('a named version:', st, json.dumps(r, ensure_ascii=False)[:200])
              assert st in (200, 201), r
              st, fo = call('/api/folders', {'name': FOLDER})
              assert st in (200, 201) and fo.get('id'), fo
              st, r = call('/api/folders/put', {'project': folder, 'folder': fo['id']})
              assert st == 200, r
              st, r = call('/api/hints', {'seen': 'plan'}, 'PUT')
              print('a hint seen:', st)
              p = json.load(open(prefs, encoding='utf-8-sig')) if os.path.exists(prefs) else {}
              p['ciKeep'] = {'note': 'every setting stays', 'n': 3}
              with open(prefs, 'w', encoding='utf-8') as h:
                  json.dump(p, h, ensure_ascii=False)
              s = state()
              assert s['colour'] == COLOUR and VERSION in s['versions'] and folder in (s['folders'].get(FOLDER) or []), s
              assert s['media'], 'no media files to compare'
              json.dump(s, open(snap, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
              print('before the update:', json.dumps(s, ensure_ascii=False))
          elif mode == 'check':
              print('the studio now:', os.environ['NOW'])
              assert os.environ['NOW'] == os.environ['WANT'], f"not the new version: {os.environ['NOW']} (want {os.environ['WANT']})"
              old, new = json.load(open(snap, encoding='utf-8')), state()
              print('after the update:', json.dumps(new, ensure_ascii=False))
              for k in ('folder', 'in', 'spine', 'colour', 'versions', 'media'):
                  assert old[k] == new[k], f'{k}: {old[k]!r} → {new[k]!r}'
              assert old['folders'].get(FOLDER) == new['folders'].get(FOLDER), (old['folders'], new['folders'])
              subset(old['prefs'], new['prefs'])
              print('every clip, edit, version, folder, file and setting is there')
          else:
              raise SystemExit('mode? ' + mode)
          print('PASSED', mode)
          PY
          URL="$(sed -n 's/^running: //p' <<<"$ST")" DATA="$(cygpath -w "$(sed -n 's/^data: //p' <<<"$ST")")" NOW="$(sed -n 's/^version: //p' <<<"$ST")" SNAP="$(cygpath -w "$HOME/p5-snap.json")" VIDEO="$(cygpath -w "$HOME/old-clip.mp4")" PYTHONIOENCODING=utf-8 python "$(cygpath -w "$HOME/update_data.py")" make
      - name: «حدّث الاستوديو» — update.sh from the public repository (it says there is a newer one, then brings it), then setup.sh --install with the studio still running
        run: |
          U="$HOME/.claude/skills/edit-studio/scripts/update.sh"
          bash "$U" --check | tee "$HOME/check.txt"
          grep -q "^newer ${OLD} " "$HOME/check.txt"
          bash "$U"
          WANT="$(python -c "import json; print(json.load(open('ملفات لكلود/edit-studio/manifest.json', encoding='utf-8'))['version'])")"
          grep -q "\"version\": \"$WANT\"" "$HOME/.claude/skills/edit-studio/manifest.json"
          set +e
          bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install; rc=$?
          if [ $rc -eq 11 ]; then bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install; rc=$?; fi
          echo "setup exit $rc"
          exit $rc
      - name: nothing is lost — the clip in its folder, its colour, its version, its files byte for byte, every setting; and the studio is the new version
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          bash "$S/start.sh" --no-open
          ST="$(bash "$S/studio.sh" status)"; echo "$ST"
          WANT="$(python -c "import json; print(json.load(open('ملفات لكلود/edit-studio/manifest.json', encoding='utf-8'))['version'])")"
          URL="$(sed -n 's/^running: //p' <<<"$ST")" DATA="$(cygpath -w "$(sed -n 's/^data: //p' <<<"$ST")")" NOW="$(sed -n 's/^version: //p' <<<"$ST")" WANT="$WANT" SNAP="$(cygpath -w "$HOME/p5-snap.json")" PYTHONIOENCODING=utf-8 python "$(cygpath -w "$HOME/update_data.py")" check
      - name: stop
        if: always()
        run: bash "$HOME/Documents/video-edit/studio/app/scripts/studio.sh" stop || true

  # ── audit 1.0.19 P4 (1.0.22): a follower's own path on a machine with no Node, no Python, no ffmpeg ──
  clean-machine:
    # The runner is not a new PC, and this job says what it cannot be instead of pretending:
    #  · Node and Python come with the image: they are uninstalled the way Windows lists them (Settings > Apps), the folders
    #    the image keeps outside that list (its tool cache) are taken off every PATH and renamed; then checked: none answers.
    #  · winget: Windows Server 2025 carries «App Installer» as a follower's Windows 10/11 does. The image's own winget when it
    #    answers; when it does not, App Installer from microsoft/winget-cli's release (pinned, its SHA-256 checked) is added for
    #    this user first. Either way it answers from the user's WindowsApps on PATH, as on a home PC.
    #  · the runner has no UAC prompt: a follower presses «نعم» on one for Node; nothing presses it here.
    #  · Chrome stays (the image has it); a follower may have only Edge. Git Bash stays (Claude Code needs it on Windows).
    # Then the follower's path itself: install.sh, the check (it names Node, Python and ffmpeg as missing), setup.sh --install
    # (winget brings them), exit 11 → a new shell with the PATH Windows now has (Claude closed and opened), setup.sh --install
    # again, and the studio does its main work on it: Arabic sentences from a new clip.
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: a machine with no Node, Python or ffmpeg — the image's uninstalled, its tool cache off every PATH, checked; winget as a home PC has it (App Installer, from the user's WindowsApps)
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $want = '^(Node\.js|Python \d|Python Launcher)'
          $listed = { @(Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match $want }) }
          "installed: " + ((& $listed | ForEach-Object { $_.DisplayName }) -join ' | ')
          # Python's own installers first (they take their parts with them), then every MSI left
          foreach ($a in & $listed) { if ($a.QuietUninstallString -match '^"([^"]+)"\s*(.*)$') { "uninstall: $($a.DisplayName)"; Start-Process -FilePath $Matches[1] -ArgumentList $Matches[2] -Wait -NoNewWindow } }
          # (run 41478240120: one pass left 20 of Python's parts installed, their exit codes unseen) each MSI until it is gone, its exit
          # code said; IGNOREDEPENDENCIES=ALL: Python's parts name the image's own bundle as their dependent, which refuses taking one
          # alone; 1618 (another install still running) waits and tries again
          # (run 41483737084: the same parts ended 1603 on all five passes, after Core Interpreter and Executables had gone first)
          # Python's parts before its interpreter: their own uninstall steps may run python.exe. A part that still fails says why:
          # the lines before «Return value 3» in its MSI log
          $last = 'Core Interpreter|Executables|Python Launcher|Node\.js'
          for ($pass = 1; $pass -le 5 -and (& $listed); $pass++) {
            foreach ($a in @(& $listed | Sort-Object { if ($_.DisplayName -match $last) { 1 } else { 0 } })) { if ($a.PSChildName -match '^\{[0-9A-Fa-f-]+\}$') {
              $log = Join-Path $env:RUNNER_TEMP "msi-$($a.PSChildName).log"
              $p = Start-Process msiexec.exe -ArgumentList '/x', $a.PSChildName, '/qn', '/norestart', 'IGNOREDEPENDENCIES=ALL', '/l*v', "`"$log`"" -Wait -NoNewWindow -PassThru
              "uninstall (msi, pass $pass): $($a.DisplayName) → exit $($p.ExitCode)"
              if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 1605 -and (Test-Path $log)) {
                Select-String -Path $log -Pattern 'Return value 3' -Context 8, 0 | Select-Object -First 1 | ForEach-Object { @($_.Context.PreContext) + $_.Line } | ForEach-Object { "    $_" }
              }
              if ($p.ExitCode -eq 1618) { Start-Sleep -Seconds 10 }
            } }
          }
          $left = & $listed
          if ($left) { throw "still installed: $(($left | ForEach-Object { $_.DisplayName }) -join ' | ')" }
          # what the image keeps outside Windows' list: its tool cache (every Node and Python), the py launcher if one is left
          foreach ($d in 'C:\hostedtoolcache\windows\Python', 'C:\hostedtoolcache\windows\node', 'C:\Program Files\nodejs') { if (Test-Path $d) { Rename-Item $d ((Split-Path $d -Leaf) + '.hidden') } }
          foreach ($f in 'C:\Windows\py.exe', 'C:\Windows\pyw.exe') { if (Test-Path $f) { Rename-Item $f ((Split-Path $f -Leaf) + '.hidden') } }
          Remove-Item 'HKLM:\SOFTWARE\Python', 'HKCU:\SOFTWARE\Python' -Recurse -Force -ErrorAction SilentlyContinue
          $tools = 'node.exe', 'python.exe', 'python3.exe', 'py.exe', 'ffmpeg.exe', 'ffprobe.exe', 'npm.cmd', 'pip.exe'
          $keep = { param($d) $d -and $d -notmatch 'hostedtoolcache|\\nodejs|\\npm$|\\Python\d' -and -not ($tools | Where-Object { Test-Path -LiteralPath (Join-Path $d $_) }) }
          $clean = { param($list) ($list -split ';' | Where-Object { & $keep $_ }) -join ';' }
          foreach ($s in 'Machine', 'User') { [Environment]::SetEnvironmentVariable('Path', (& $clean ([Environment]::GetEnvironmentVariable('Path', $s))), $s) }
          # winget, and its folder on the user's PATH as on a home PC. No module: Microsoft.WinGet.Client failed here three ways
          # (runs 41485971111, 41487587106: its NuGet CDN retired, no repository store; run 41492778524: Repair-WinGetPackageManager
          # -AllUsers registered the image's own older bundle for every user and Add-AppxPackage refused it, 0x80073CF1 «does not
          # have an appropriate application package for x64»). The image's own winget when it answers; when it does not, App
          # Installer v1.29.380 from microsoft/winget-cli's release, its SHA-256 pinned, with the x64 dependencies the release ships,
          # added for this user as the full app (the bundle also carries the Store's stub)
          $apps = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps'
          $answers = { $w = Join-Path $apps 'winget.exe'; if (Test-Path -LiteralPath $w) { try { $v = "$(& $w --version)".Trim(); if ($LASTEXITCODE -eq 0 -and $v -match '^v\d') { $v } } catch { Write-Host "  winget.exe there does not start: $_" } } }
          $v = & $answers
          if ($v) { "winget the image has: $v" } else {
            'no winget answers on this image: App Installer v1.29.380 from the release'
            $ProgressPreference = 'SilentlyContinue'
            $rel = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380'
            $sha = @{ 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle' = '65DEA9C01CE08EE7B763366B27C0E651F97DB857C11CA9B9C301826C10092F2E'
                      'DesktopAppInstaller_Dependencies.zip' = 'BA875AFE9D190F61218985AC0292A99D1DB710BF93E13C68944CA9D89F0D82D1' }
            foreach ($n in $sha.Keys) {
              Invoke-WebRequest "$rel/$n" -OutFile (Join-Path $env:RUNNER_TEMP $n)
              $h = (Get-FileHash (Join-Path $env:RUNNER_TEMP $n) -Algorithm SHA256).Hash
              if ($h -ne $sha[$n]) { throw "$n is not the release's own (SHA-256 $h)" }
            }
            Expand-Archive (Join-Path $env:RUNNER_TEMP 'DesktopAppInstaller_Dependencies.zip') (Join-Path $env:RUNNER_TEMP 'wg-deps') -Force
            # the three DesktopAppInstaller_Dependencies.json lists: VCLibs.140.00, its UWPDesktop, WindowsAppRuntime.1.8
            $deps = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'wg-deps\x64') -Filter *.appx | ForEach-Object FullName)
            if ($deps.Count -ne 3) { throw "the release's x64 dependencies are not its three: $($deps -join ' | ')" }
            # in Windows PowerShell, its own Appx module: pwsh reaches Appx through a remote session that turns -DependencyPath's
            # list into one string. A refusal prints its deployment log (Get-AppPackageLog) before the step stops
            powershell.exe -NoProfile -Command {
              param($bundle, $deps)
              $ErrorActionPreference = 'Stop'
              $ai = { (Get-AppxPackage -Name Microsoft.DesktopAppInstaller | ForEach-Object { "$($_.Version) $($_.Architecture) $($_.Status)" }) -join ' | ' }
              "App Installer for this user before: $(& $ai)"
              $o = @{ Path = $bundle; DependencyPath = @($deps -split '\|') }
              if ((Get-Command Add-AppxPackage).Parameters.ContainsKey('StubPackageOption')) { $o.StubPackageOption = 'InstallFull' }
              try { Add-AppxPackage @o } catch {
                "Add-AppxPackage: $_"
                if ("$_" -match 'ActivityId\]\s*([0-9a-fA-F-]{36})') { try { Get-AppPackageLog -ActivityID $Matches[1] | Select-Object -First 40 | ForEach-Object { "    $($_.Message)" } } catch { "    (no deployment log: $_)" } }
                throw
              }
              "App Installer for this user now: $(& $ai)"
            } -args (Join-Path $env:RUNNER_TEMP 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle'), ($deps -join '|')
            if ($LASTEXITCODE -ne 0) { throw "App Installer was not added (Windows PowerShell exit $LASTEXITCODE)" }
            # its alias in WindowsApps may land a moment after the deployment returns: waited on, never read once
            for ($i = 0; $i -lt 60 -and -not ($v = & $answers); $i++) { Start-Sleep -Seconds 1 }
            if (-not $v) { throw "winget does not answer from $apps after App Installer was added" }
            "winget added: $v"
          }
          $u = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($u -split ';') -notcontains $apps) { [Environment]::SetEnvironmentVariable('Path', ($u.TrimEnd(';') + ';' + $apps).TrimStart(';'), 'User') }
          # every later step starts with this machine's PATH, as a program opened now would (and Git's tools)
          $now = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          foreach ($g in 'C:\Program Files\Git\bin', 'C:\Program Files\Git\cmd') { if (($now -split ';') -notcontains $g) { $now = "$g;$now" } }
          "PATH=$now" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:Path = $now
          # found by its name on that PATH, from the user's WindowsApps (App Installer's alias), as a follower's shell finds it
          $wg = (Get-Command winget -ErrorAction SilentlyContinue).Source
          if ($wg -notmatch '\\Microsoft\\WindowsApps\\winget\.exe$') { throw "winget is not on PATH from the user's WindowsApps (found: «$wg»)" }
          & $wg --version
          if ($LASTEXITCODE -ne 0) { throw "winget does not answer ($wg)" }
          $found =foreach ($n in 'node', 'python', 'python3', 'py', 'ffmpeg') { Get-Command $n -All -ErrorAction SilentlyContinue | Where-Object { $_.Source -notmatch 'WindowsApps' } | ForEach-Object { "$n → $($_.Source)" } }
          if ($found) { throw "still on this machine: $($found -join ' | ')" }
          'no Node, Python or ffmpeg on this machine (the WindowsApps «python» left is the Store stub every Windows has)'
      - name: install the two skills
        run: bash "ملفات لكلود/install.sh"
      - name: the check on this machine names what is missing — ffmpeg, Node, Python
        run: |
          set +e
          bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" > "$HOME/check.txt" 2>&1; rc=$?
          set -e
          cat "$HOME/check.txt"; echo "check exit $rc"
          # setup.sh's own line and its code for missing montage tools (run 41576618772 looked for the montage skill's words,
          # «الناقص:» and «أداة القص والصوت», which setup.sh never prints)
          [ $rc -eq 11 ] || { echo "the check ends $rc, not 11 (montage tools missing)"; exit 1; }
          grep 'ناقص من أدوات المونتاج' "$HOME/check.txt" > "$HOME/missing.txt" || { echo "the check has no «ناقص من أدوات المونتاج» line"; exit 1; }
          for t in 'ffmpeg' 'Node' 'Python'; do grep -q "$t" "$HOME/missing.txt" || { echo "the check does not say «$t» is missing"; exit 1; }; done
      - name: setup install as the follower runs it — winget brings Node, Python 3.12 and ffmpeg; on exit 11 a new shell with the PATH Windows has now (Claude closed and opened), and once more
        run: |
          set +e
          bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install; rc=$?
          echo "setup exit $rc"
          # what a program opened now gets: the PATH Windows has after winget (Machine + User), with Git's tools
          fresh(){ printf '%s;%s;%s' 'C:\Program Files\Git\bin' 'C:\Program Files\Git\cmd' "$(powershell.exe -NoProfile -Command "[Console]::OutputEncoding=[Text.UTF8Encoding]::new(\$false); [Environment]::GetEnvironmentVariable('Path','Machine')+';'+[Environment]::GetEnvironmentVariable('Path','User')" | tr -d '\r')"; }
          if [ $rc -eq 11 ]; then
            PATH="/usr/bin:/mingw64/bin:$(cygpath -u -p "$(fresh)")" bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install; rc=$?
            echo "setup exit (a new shell) $rc"
          fi
          echo "PATH=$(fresh)" >> "$GITHUB_ENV"
          exit $rc
      - name: the studio works on it — its tools are winget's, it starts, and «مقطع جديد» on Arabic speech gives Arabic sentences
        run: |
          for t in node python ffmpeg; do echo "$t: $(command -v $t)"; command -v $t >/dev/null; done
          if command -v node python | grep -qi 'hostedtoolcache\|nodejs.hidden'; then echo "the image's own tools answer, not winget's"; exit 1; fi
          S="$HOME/Documents/video-edit/studio/app/scripts"
          bash "$S/start.sh" --no-open
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          ffmpeg -nostdin -v error -y -i "$GITHUB_WORKSPACE/.github/test/arabic-speech.mp3" -f lavfi -i testsrc2=size=360x640:rate=30 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 48000 "$HOME/arabic.mp4"
          cat > "$HOME/arabic_words.py" <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request
          # «مقطع جديد» with the whole montage on a clip of Arabic speech (ElevenLabs' «Saad», never the author's voice: «مرحبا، هذا
          # اختبار التفريغ العربي في الاستوديو على ويندوز. نجرب الجمل والكابشن.»), with the default settings: the sentences come, in
          # Arabic, and words of what was said are in them. env: URL (the running studio), VIDEO, NAME
          url, video, name = os.environ['URL'].rstrip('/'), os.environ['VIDEO'], os.environ['NAME']


          def call(path, body=None, timeout=60):
              req = urllib.request.Request(url + path, data=None if body is None else json.dumps(body).encode('utf-8'),
                                           headers={'content-type': 'application/json'}, method='GET' if body is None else 'POST')
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode('utf-8') or '{}')
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode('utf-8') or '{}')
              except (urllib.error.URLError, TimeoutError, ConnectionError) as e:
                  return 0, {'error': str(e)}


          t0 = time.time()
          st, j = call('/api/raw/start', {'path': video, 'name': name, 'mode': 'full', 'face': 'none'})
          print('start', st, json.dumps(j, ensure_ascii=False))
          assert st == 202 and j.get('folder'), j
          q, c, last = '/x/' + urllib.parse.quote(j['folder']) + '/api/cut', {}, 0
          while time.time() - t0 < 1800:
              st, c = call(q)
              if st == 200 and c.get('state') == 'ready':
                  break
              if st == 200 and (c.get('state') == 'stalled' or c.get('hearFail')):
                  raise SystemExit('stopped: ' + json.dumps(c, ensure_ascii=False)[:1500])
              if time.time() - last > 30:
                  last = time.time(); print(f'  {int(last - t0)} s', c.get('state'), c.get('step'), c.get('pct'), flush=True)
              time.sleep(2)
          else:
              raise SystemExit('not ready in 30 min: ' + json.dumps(c, ensure_ascii=False)[:1500])
          said = ' '.join(i['text'] for i in c.get('islands', []) if i.get('text', '').strip())
          print(f'sentences after {int(time.time() - t0)} s:', c.get('heard'), said)
          words = said.split()
          arabic = [w for w in words if re.search('[؀-ۿ]', w)]
          assert words and len(arabic) >= 0.8 * len(words), 'not Arabic: ' + said
          hits = [w for w in ('مرحبا', 'اختبار', 'التفريغ', 'العربي', 'ويندوز', 'الجمل', 'الكابشن') if w in said]
          print('words of the sentence heard:', hits)
          assert len(hits) >= 3, 'the sentence said is not there: ' + said
          print('PASSED')
          PY
          # (run by the montage tools' Python: on a machine like this one «python» may be the Store's stub)
          URL="$URL" VIDEO="$(cygpath -w "$HOME/arabic.mp4")" NAME='جمل على جهاز نظيف' PYTHONIOENCODING=utf-8 "$HOME/Documents/video-edit/tools/py/Scripts/python.exe" "$(cygpath -w "$HOME/arabic_words.py")"
      - name: stop
        if: always()
        run: bash "$HOME/Documents/video-edit/studio/app/scripts/studio.sh" stop || true
      - name: server log
        if: always()
        run: tail -n 30 "$HOME/Documents/video-edit/studio/server.log" 2>/dev/null || true
