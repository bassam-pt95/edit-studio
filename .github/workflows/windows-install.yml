          assert (c.get('heard') or {}).get('ok') is True and c['heard'].get('words', 0) > 0, c.get('heard')
          # Arabic: most words in Arabic letters, and words of the sentence that was said
          words = said.split()
          arabic = [w for w in words if re.search('[\u0600-\u06FF]', w)]
          assert words and len(arabic) >= 0.8 * len(words), 'not Arabic: ' + said
          hits = [w for w in ('مرحبا', 'اختبار', 'التفريغ', 'العربي', 'ويندوز', 'الجمل', 'الكابشن') if w in said]
          print('words of the sentence heard:', hits)
          assert len(hits) >= 3, 'the sentence said is not there: ' + said
          PY
      - name: data safety on Windows (1.0.21) — prefs.json held open by another program is never written over, saves leave no tmp, an export takes its name only once muxed, a broken clip comes back, a second server on the same projects is refused
        # audit 1.0.19 batch C (D3, D2, D4, D1, D8) on the studio as installed, the clip «مقطع جديد» made above
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          D="$HOME/Documents/video-edit/studio"
          export URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')" DATA="$(cygpath -w "$D")" CLIP='تجربة ويندوز' SERVER="$(cygpath -w "$D/app/studio/server.mjs")" PYTHONIOENCODING=utf-8
          cat > "$HOME/data_check.py" <<'PY'
          import json, os, shutil, subprocess, sys, urllib.error, urllib.parse, urllib.request
          # batch C (1.0.21) on the studio as installed: URL = the running studio, DATA = its data folder (home/, projects/),
          # CLIP = the clip «مقطع جديد» made above, SERVER = its server.mjs. One mode per call (the step runs them in order).
          url, D, clip = os.environ['URL'], os.environ['DATA'], os.environ['CLIP']
          home, projects = os.path.join(D, 'home'), os.path.join(D, 'projects')
          prefs = os.path.join(home, 'prefs.json')
          def call(path, body=None, method=None, raw=None, ctype='application/json', timeout=120):
              data = raw if raw is not None else (None if body is None else json.dumps(body).encode('utf-8'))
              req = urllib.request.Request(url + path, data=data, headers={'content-type': ctype}, method=method or ('GET' if data is None else 'POST'))
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode('utf-8') or '{}')
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode('utf-8') or '{}')
          q = lambda f: 'x/' + urllib.parse.quote(f)
          read = lambda f: open(f, 'rb').read()
          def write(f, b):
              with open(f, 'wb') as h: h.write(b)
          mode = sys.argv[1]

          if mode == 'prefs-prep':
              # D3: every setting he has stays; a marker shows it
              p = json.loads(read(prefs).decode('utf-8')) if os.path.exists(prefs) else {}
              p['ciKeep'] = 'every setting stays'
              write(prefs, json.dumps(p, ensure_ascii=False).encode('utf-8'))
              print('prefs.json:', p)

          elif mode == 'prefs-held':
              # D3: another program holds prefs.json (open with no sharing): an ordinary write is refused with why, never {}+change
              st, j = call('api/hints', {'seen': 'plan'}, 'PUT')
              print('a hint press while prefs.json is held:', st, json.dumps(j, ensure_ascii=False))
              assert st == 409 and j.get('error') == 'prefs.err.unreadable' and (j.get('vars') or {}).get('why'), j

          elif mode == 'prefs-after':
              p = json.loads(read(prefs).decode('utf-8'))
              assert p.get('ciKeep') == 'every setting stays', 'written over: %r' % p
              good = read(prefs)
              write(prefs, good[:25])                                   # half written (a cut write): refused too
              st, j = call('api/hints', {'seen': 'plan'}, 'PUT')
              print('a hint press on a half-written prefs.json:', st, json.dumps(j, ensure_ascii=False))
              assert st == 409 and j.get('error') == 'prefs.err.unreadable', j
              assert read(prefs) == good[:25], 'written over'
              write(prefs, good)
              st, j = call('api/hints', {'seen': 'plan'}, 'PUT')
              assert st == 200, j
              assert json.loads(read(prefs).decode('utf-8')).get('ciKeep') and json.loads(read(prefs + '.bak').decode('utf-8')).get('ciKeep'), 'prefs.json or its .bak lost a setting'
              print('readable again: written, the last good file kept as prefs.json.bak')

          elif mode == 'saves':
              # D2: five saves in a row, each through a tmp of its own synced to the disk: none left beside project.json
              st, g = call(q(clip) + '/api/project')
              assert st == 200, g
              rev, p = g['rev'], g['project']
              for i in range(5):
                  p.setdefault('meta', {})['ciSaves'] = i
                  st, r = call(q(clip) + '/api/project', {'baseRev': rev, 'clientId': 'ci', 'project': p}, 'PUT')
                  assert st == 200, r
                  rev = r['rev']
              left = [f for f in os.listdir(os.path.join(projects, clip)) if f.endswith('.tmp')]
              print('5 saves, rev', rev, '| tmp files left:', left)
              assert not left, left

          elif mode == 'export':
              # D4: the mux writes «<name>.mp4.part» and the file takes its name once it is through (Windows: renameRetry)
              name = 'تصدير ويندوز'
              st, j = call(q(clip) + '/api/export', {'name': name, 'range': [0, 6]})
              assert st == 200, j
              job = j['jobId']
              st, info = call(q(clip) + '/api/export/' + job)
              frame = bytes([90]) * (info['W'] * info['H'] * 4)
              for n in range(6):
                  st, r = call(q(clip) + '/api/export/%s/frame?n=%d' % (job, n), raw=frame, ctype='application/octet-stream')
                  assert st == 200, r
              st, d = call(q(clip) + '/api/export/%s/done' % job, {}, timeout=600)
              print('export:', st, json.dumps({k: d.get(k) for k in ('file', 'verify', 'error', 'vars')}, ensure_ascii=False))
              assert st == 200, d
              out = os.listdir(os.path.join(projects, clip, 'out'))
              print('out/:', out)
              assert name + '.mp4' in out and not [f for f in out if f.endswith('.part')], out

          elif mode == 'broken':
              # D1: a copy of the clip with its project.json cut (what a crash can leave) is a broken card, and comes back
              copy = 'تجربة تالفة'
              dst = os.path.join(projects, copy)
              shutil.rmtree(dst, ignore_errors=True)
              shutil.copytree(os.path.join(projects, clip), dst, ignore=shutil.ignore_patterns('out', 'render'))
              hist = os.path.join(dst, '.history')
              snaps = [f for f in os.listdir(hist) if f.startswith('project-')] if os.path.isdir(hist) else []
              assert snaps, 'no snapshot in .history to come back to'
              write(os.path.join(dst, 'project.json'), read(os.path.join(dst, 'project.json'))[:200])
              st, lst = call('api/projects')
              e = next((x for x in lst.get('projects', []) if x.get('folder') == copy), None)
              print('the library:', json.dumps(e, ensure_ascii=False))
              assert e and e.get('broken') and e['broken'].get('good'), 'not a broken card with its good copy'
              st, r = call('api/projects/%s/restore-good' % urllib.parse.quote(copy), {})
              print('«رجّع آخر نسخة سليمة»:', st, json.dumps(r, ensure_ascii=False))
              assert st == 200 and r.get('ok'), r
              st, pr = call(q(copy) + '/api/project')
              assert st == 200 and pr['project']['spine'], pr
              assert os.path.exists(os.path.join(dst, *r['kept'].split('/'))), 'the broken file was not kept'
              st, lst = call('api/projects')
              assert not next(x for x in lst['projects'] if x['folder'] == copy).get('broken')

          elif mode == 'second':
              # D8: a second server on the same projects folder ends at once (exit 1) and names the running one
              r = subprocess.run([shutil.which('node'), os.environ['SERVER'], '--root', projects, '--port', '0'], capture_output=True, encoding='utf-8',
                                 timeout=60, env={**os.environ, 'MOHRER_HOME': home, 'MOHRER_MODEL_FETCH': '0'})
              said = (r.stdout + r.stderr).strip()
              print('a second server on the same projects:', r.returncode, said[:400])
              assert r.returncode == 1 and url.rstrip('/') in said, 'not refused'

          elif mode == 'crash-leave':
              # D4 + D5: what a crash leaves (an export cut mid-mux, a job's render folder)
              c = os.path.join(projects, clip)
              os.makedirs(os.path.join(c, 'render', 'xcidead000'), exist_ok=True)
              write(os.path.join(c, 'render', 'xcidead000', 'video.mp4'), b'encoded video')
              write(os.path.join(c, 'out', 'بعد الانهيار.mp4.part'), b'half a file')
              print('left:', os.listdir(os.path.join(c, 'out')), os.listdir(os.path.join(c, 'render')))

          elif mode == 'crash-after':
              c = os.path.join(projects, clip)
              st, _ = call(q(clip) + '/api/project')
              assert st == 200
              out, render = os.listdir(os.path.join(c, 'out')), os.listdir(os.path.join(c, 'render'))
              print('after the start:', out, render)
              assert 'بعد الانهيار.mp4.part' not in out and 'xcidead000' not in render, 'not cleared'
              assert 'تصدير ويندوز.mp4' in out, 'a real export went'

          else:
              raise SystemExit('mode? ' + mode)
          print('PASSED', mode)
          PY
          C="$(cygpath -w "$HOME/data_check.py")"
