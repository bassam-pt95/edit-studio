          import ctypes, ctypes.wintypes as W, json, sys, time
          # The file picked in Windows' own «open» window the way a hand does it: the window found by its title, the path typed in its
          # file-name box, «Open» pressed; then the window is gone. argv: the window's title, the file's full path. Windows only.
          title, path = sys.argv[1], sys.argv[2]
          u = ctypes.windll.user32
          for name, args in (('GetWindowTextLengthW', [W.HWND]), ('GetWindowTextW', [W.HWND, W.LPWSTR, ctypes.c_int]), ('GetClassNameW', [W.HWND, W.LPWSTR, ctypes.c_int]),
                             ('IsWindow', [W.HWND]), ('IsWindowVisible', [W.HWND]), ('GetDlgCtrlID', [W.HWND]), ('GetParent', [W.HWND])):
              getattr(u, name).argtypes = args
          u.GetParent.restype = W.HWND
          u.SendMessageW.argtypes = [W.HWND, W.UINT, W.WPARAM, W.LPARAM]
          u.SendMessageW.restype = W.LPARAM
          u.PostMessageW.argtypes = [W.HWND, W.UINT, W.WPARAM, W.LPARAM]
          WM_SETTEXT, WM_GETTEXT, WM_COMMAND, BM_CLICK, IDOK = 0x000C, 0x000D, 0x0111, 0x00F5, 1
          ENUM = ctypes.WINFUNCTYPE(W.BOOL, W.HWND, W.LPARAM)


          def text(h):
              n = u.GetWindowTextLengthW(h); b = ctypes.create_unicode_buffer(n + 1); u.GetWindowTextW(h, b, n + 1)
              return b.value


          def cls(h):
              b = ctypes.create_unicode_buffer(256); u.GetClassNameW(h, b, 256)
              return b.value


          def tops():
              found = []
              u.EnumWindows(ENUM(lambda h, _: (found.append(h) if u.IsWindowVisible(h) else None) or True), 0)
              return found


          def kids(h):
              found = []
              u.EnumChildWindows(h, ENUM(lambda c, _: found.append(c) or True), 0)
              return found


          t0, win = time.time(), None
          while time.time() - t0 < 60 and not win:
              win = next((h for h in tops() if text(h) == title), None)
              time.sleep(0.25)
          if not win:
              raise SystemExit('no window «%s» on the screen. Visible: %s' % (title, json.dumps([text(h) for h in tops() if text(h)], ensure_ascii=False)))
          time.sleep(1.0)                                                  # its controls are made a moment after it shows
          ks = kids(win)
          # the file-name box: the Edit inside the ComboBox (the search box at the top has another parent)
          edits = [k for k in ks if cls(k) == 'Edit']
          box = next((k for k in edits if cls(u.GetParent(k)) == 'ComboBox'), edits[0] if edits else None)
          if not box:
              raise SystemExit('no file-name box in the window: ' + json.dumps([(cls(k), u.GetDlgCtrlID(k), text(k)) for k in ks], ensure_ascii=False))
          buf = ctypes.create_unicode_buffer(path)
          u.SendMessageW(box, WM_SETTEXT, 0, ctypes.addressof(buf))
          got = ctypes.create_unicode_buffer(1024)
          u.SendMessageW(box, WM_GETTEXT, 1024, ctypes.addressof(got))
          print('typed:', got.value)
          if got.value != path:
              raise SystemExit('the box did not take the path')
          ok = next((k for k in ks if cls(k) == 'Button' and u.GetDlgCtrlID(k) == IDOK), None)
          if ok:
              u.PostMessageW(ok, BM_CLICK, 0, 0)
          else:
              u.PostMessageW(win, WM_COMMAND, IDOK, 0)
          t0 = time.time()
          while time.time() - t0 < 20 and u.IsWindow(win) and u.IsWindowVisible(win):
              time.sleep(0.25)
          if u.IsWindow(win) and u.IsWindowVisible(win):
              raise SystemExit('the window stayed open after «Open»: ' + json.dumps([(cls(k), u.GetDlgCtrlID(k), text(k)) for k in kids(win)], ensure_ascii=False)[:1500])
          print('picked:', path)
          PY
          cat > "$HOME/new_clip_press.cjs" <<'JS'
          // P7 (audit 1.0.19): «مقطع جديد» pressed on the page as he presses it. The studio as installed, in Chrome (puppeteer-core):
          // the library page, its «مقطع جديد» button (offered on this system), the system's own file window (PICK: a program started
          // right after the press that picks VIDEO in that window, as a hand would), the sheet answered («تعديل يدوي فقط», no face),
          // and the clip opens in the page: its name from the file («(خام)» taken off), its picture served.
          // env: PP (puppeteer-core's folder), CHROME, URL (the running studio), VIDEO (the file), PICK (optional: the picker, a JSON
          // array [program, ...args]; without it the studio answers the window itself, MOHRER_RAW_PICK, for a trial off Windows)
          const pptr = require(process.env.PP);
          const path = require('node:path');
          const { spawn } = require('node:child_process');

          const url = process.env.URL.replace(/\/+$/, '');
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const get = async (p) => { const r = await fetch(url + p); return { status: r.status, body: r.headers.get('content-type') && r.headers.get('content-type').includes('json') ? await r.json() : await r.arrayBuffer() }; };
          const want = path.basename(process.env.VIDEO, path.extname(process.env.VIDEO)).replace(/\s*\(\s*خام\s*\)\s*/g, ' ').replace(/\s+/g, ' ').trim();

          (async () => {
            const b = await pptr.launch({ executablePath: process.env.CHROME, headless: true, args: ['--no-first-run', '--no-default-browser-check'] });
            const fail = async (why) => { console.error('FAILED:', why); await b.close().catch(() => {}); process.exit(1); };
            try {
              const page = await b.newPage();
              await page.setViewport({ width: 1280, height: 800 });
              const errors = [];
              page.on('pageerror', (e) => errors.push(e.message));
              await page.goto(`${url}/?test=1`, { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => window.__mohrer && window.__mohrer.ready === true, { timeout: 120000 });
              const btn = await page.$('.hd-new');
              if (!btn || !(await btn.isVisible())) return fail('no «مقطع جديد» button on the page on this system');
              console.log('the button:', await page.$eval('.hd-new', (e) => e.textContent.trim()));
              await btn.click();
              if (process.env.PICK) {
                const [prog, ...args] = JSON.parse(process.env.PICK);
                const picked = await new Promise((res) => {
                  const c = spawn(prog, args, { stdio: ['ignore', 'pipe', 'pipe'], env: { ...process.env, PYTHONIOENCODING: 'utf-8' } });
                  let out = '';
                  c.stdout.on('data', (d) => { out += d; }); c.stderr.on('data', (d) => { out += d; });
                  c.on('error', (e) => res({ code: -1, out: String(e) }));
                  c.on('exit', (code) => res({ code, out }));
                });
                console.log('the file window:', picked.out.trim());
                if (picked.code !== 0) return fail('the file could not be picked in the window');
              }
              await page.waitForSelector('.raw-sheet .raw-modes', { visible: true, timeout: 60000 });
              await page.click('.raw-face[data-face="none"]');
              await page.click('.raw-mode[data-mode="manual"]');
              console.log('the sheet:', await page.$eval('.dialog .dlg-primary', (e) => e.textContent.trim()));
              await page.click('.dialog .dlg-primary');
              await page.waitForFunction(() => !!new URL(location.href).searchParams.get('p'), { timeout: 120000, polling: 200 });
              const folder = await page.evaluate(() => new URL(location.href).searchParams.get('p'));
              await page.waitForFunction(() => window.__mohrer && window.__mohrer.ready === true, { timeout: 120000 });
              // (run 41483737084) the page opens a new clip as soon as the library lists it, and its timeline is written a moment
              // later (project.json: its video, then the one clip on the timeline): wait for that state, then judge it
              await page.waitForFunction(() => { const s = window.__mohrer.store.state.p; return s.spine.length > 0; }, { timeout: 120000, polling: 250 }).catch(() => {});
              const p = await page.evaluate(() => { const s = window.__mohrer.store.state.p; return { name: s.name, spine: s.spine.length, assets: Object.entries(s.assets).map(([id, a]) => ({ id, kind: a.kind })) }; });
              console.log('opened:', folder, JSON.stringify(p));
              if (p.name !== want) return fail(`the clip's name is «${p.name}», not «${want}»`);
              const v = p.assets.find((a) => a.kind === 'video');
              if (!p.spine || !v) return fail('the clip has no video on its timeline');
              // its first picture, once its preview copy is made (a few seconds after it opens)
              let still = null;
              for (let i = 0; i < 120 && !(still && still.status === 200); i++) { if (i) await sleep(1000); still = await get(`/x/${encodeURIComponent(folder)}/api/still?asset=${encodeURIComponent(v.id)}&n=0`); }
              console.log('its picture:', still.status, still.body.byteLength || 0, 'bytes');
              if (still.status !== 200 || !(still.body.byteLength > 1000)) return fail('no picture of the clip');
              if (errors.length) console.log('page errors:', errors.join(' | '));
              await b.close();
              console.log('PASSED');
            } catch (e) { await fail(e && e.stack || e); }
          })();
          JS
          V="$(cygpath -w "$HOME/Videos/مقطع ضغطة (خام).mp4")"
          PICK="$(PYTHONIOENCODING=utf-8 python -c "import json, sys; print(json.dumps([sys.executable, sys.argv[1], 'اختر الفيديوهات', sys.argv[2]], ensure_ascii=False))" "$(cygpath -w "$HOME/pick_file.py")" "$V")"
          PP="$(cygpath -w "$HOME/pp/node_modules/puppeteer-core")" CHROME="$(cygpath -w "$B")" URL="$URL" VIDEO="$V" PICK="$PICK" PYTHONIOENCODING=utf-8 node "$(cygpath -w "$HOME/new_clip_press.cjs")"
          taskkill //F //IM chrome.exe >/dev/null 2>&1 || true
      - name: an export the way he makes it (audit 1.0.19, P1, and P8's export case) — a 35 s clip reversed (HEVC on the processor) and slowed to 0.5× from its menu, a drawing by the studio's own tool, «تصدير» pressed, closing asks while it runs; then the file — every frame, its sound, the drawing in its seconds only, the picture backwards at half speed
        # the source gets 7 levels brighter every second, so the brightness of each second of the file says which second of the
        # source it shows; the drawing goes through tools/studio-mcp.mjs `draw`, the way Claude draws one
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
