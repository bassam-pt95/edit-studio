      - name: an Arabic user folder with a space (audit 1.0.19, P9) — everything installed again with HOME and USERPROFILE at «C:\Users\Public\مستخدم تجربة», the data falls back to C:/EditStudio, a clip from under that folder gives Arabic sentences, its face detector loads, and an export with a drawing comes out
