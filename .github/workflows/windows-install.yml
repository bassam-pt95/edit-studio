          # S6 (audit 1.0.19): the studio's window brought in front takes the page's title (the clip's name) as data. The clip «TITLE»
          # was made and its window opened just before. 0: the control: the name below, put in the PowerShell text the way the studio
          # did before 1.0.22, does run its command (so its not running proves something); 1: through the studio's own route that
          # name runs nothing; 2: the window of «Ali’s vlog» is found by its title (AppActivate answers true), with the installed
          # studio's own command. Whether Windows lets a program in the background take the front is Windows' call: printed, not asserted.
          # env: URL, FOLDER (the clip's folder), TITLE (its name), BROWSER_MJS (the installed server/browser.mjs), NODE
          url, folder, title = os.environ['URL'].rstrip('/'), os.environ['FOLDER'], os.environ['TITLE']
