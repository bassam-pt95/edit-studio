                console.log('0.5× on the clip');
              }

              // 5 a drawing, through the studio's own tool: a red bar that grows over its first second, at 1–3 s
              const BAR = 'function draw(g, t, k) {\n  const p = k.map(t, 0, 1, 0.05, 1, \'out\');\n  g.fillStyle = \'#ff2020\';\n  g.fillRect(k.W * 0.2, k.H * 0.45, k.W * 0.6 * p, k.H * 0.1);\n}';
              t0 = Date.now();
              const mcp = tools({ STUDIO_DIR: dir, STUDIO_BASE: url + x, STUDIO_SOUNDS: '' });
              await mcp.hello();
              const d = await mcp.call('draw', { name: 'شريط أحمر', at: 1, dur: 2, code: BAR });
              mcp.stop();
              console.log(`draw (${secs(t0)} s):`, d.text.split('\n').slice(0, 2).join(' | '));
              const item = (/item (x_\w+)/.exec(d.text) || [])[1];
              if (d.isError || !item) return fail(`the drawing: ${d.text} ${d.log}`);
              await until(() => hook((m, id) => m.store.state.p.attached.some((a) => a.id === id), item), 60000, 'the drawing on the page');

              // 6 «تصدير», the way he presses it
              await hook((m) => m.sync && m.sync.flush && m.sync.flush());
              const L = await hook((m, id) => { const p = m.store.state.p, l = m.store.state.L.index.get(id); return { total: m.store.state.L.total, fps: p.fps[0] / p.fps[1], W: p.W || p.width, H: p.H || p.height, at: l ? [l.start, l.end] : null }; }, item);
              console.log('the timeline:', JSON.stringify(L));
              const T = await hook((m) => ({ exp: m.t('hd.export'), go: m.t('ex.go'), done: m.t('ex.done'), review: m.t('pf.title'), anyway: m.t('pf.anyway') }));
              // a real mouse press on the button (Chrome asks before closing only a page he has pressed in)
              const press = async (label) => {
                const el = (await page.evaluateHandle((s) => [...document.querySelectorAll('button')].find((x) => x.offsetParent !== null && x.textContent.trim() === s) || null, label)).asElement();
                if (!el) return false;
