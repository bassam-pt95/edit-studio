              const was = await clip();
              if (STEPS.includes('reverse')) {
              await menu(['اعكسه']);
              await until(async () => (await clip()).rev, 900000, 'the reversed copy');
              const rev = await clip();
              console.log(`reversed in ${secs(t0)} s:`, JSON.stringify(rev));
              if (rev.asset === was.asset) return fail('the reversed clip shows the same file');
              const reversed = await hook((m, a) => { const x = m.store.state.p.assets[a]; return x.master || x.file; }, rev.asset);   // the copy made, not its preview
              const codec = spawnSync('ffprobe', ['-v', 'error', '-select_streams', 'v:0', '-show_entries', 'stream=codec_name,pix_fmt', '-of', 'csv=p=0', path.join(dir, reversed)], { encoding: 'utf8' }).stdout.trim();
              console.log('the reversed copy:', reversed, codec);
              }

              // 4 «السرعة» → 0.5×
