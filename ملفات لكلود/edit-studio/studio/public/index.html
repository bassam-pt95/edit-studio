<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="studio/favicon.png">
<link rel="manifest" href="studio/app.webmanifest">
<meta name="theme-color" content="#111111">
<title>B Studio</title>
<script>
// Interface language, chosen before anything is drawn (js/ui/i18n.js reads <html lang> when it loads).
// ?lang=en or ?lang=ar saves the choice in this browser; without it the saved choice applies. Arabic is the default.
(function () {
  try {
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'ar' || q === 'en') localStorage.setItem('mohrer.lang', q);
    if (localStorage.getItem('mohrer.lang') === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
  } catch (e) { /* storage blocked: Arabic */ }
  // not a Mac: css/base.css gives the panels thin scrollbars (the classic 15px ones narrow the fixed-width panels)
  try { if (!/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '')) document.documentElement.setAttribute('data-os', 'pc'); } catch (e) { /* the Mac's look */ }
})();
</script>
<script id="theme-boot">
// Appearance, chosen before the first paint so nothing flashes (ui/appearance.js keeps it right afterwards and a unit
// test holds this script to the same rule as its resolveTheme): his saved choice, else dark; «auto» follows the device.
(function () {
  var m = null, light;
  try { m = localStorage.getItem('mohrer.theme'); } catch (e) { /* storage blocked: follows the device */ }
  if (m === 'light') light = true;
  else if (m === 'auto') { try { light = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches); } catch (e) { light = false; } }
  else light = false;
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
})();
</script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<script type="module" src="js/main.js"></script>
<link rel="stylesheet" href="studio/brand.css">
<script src="studio/brand.js" defer></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
