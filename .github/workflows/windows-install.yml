# تجربة التركيب على ويندوز: نفس اللي يسويه كلود عند المتابع (install.sh ثم setup.sh ثم تشغيل وإيقاف)، من Git Bash.
# يدوي: gh workflow run windows-install.yml
name: windows-install
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # الملفات لازم توصل ببايتاتها (الاستوديو يفحص بصمة كل ملف): بدون هذا ويندوز يبدّل نهايات الأسطر عند السحب
      - name: keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # (a follower's machine gets Python 3.12 from winget through 00_setup.sh; the runner has no winget)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: install the two skills
        run: bash "ملفات لكلود/install.sh"
      - name: setup check (before)
        run: bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" || echo "check exit $?"
      - name: setup install, everything at once (1.0.16) — the montage tools, the studio, its sound tools, the transcription model
        # 11: tools just installed that this shell cannot see (on a follower's machine: Claude closed and opened); once more
        run: |
          bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install; rc=$?
          if [ $rc -eq 11 ]; then bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh" --install; rc=$?; fi
          echo "setup exit $rc"
      - name: everything came with it — the montage skill's Python, its transcriber, the model on the disk
        run: |
          # (the first of the two places that has it: ls of a missing one fails the step under pipefail)
          MPY=""; for c in "$HOME/Documents/video-edit/tools/py/Scripts/python.exe" /c/EditStudio/tools/py/Scripts/python.exe; do [ -x "$c" ] && { MPY="$c"; break; }; done
          echo "montage python: $MPY"
          [ -n "$MPY" ]
          "$MPY" -c "import faster_whisper, av; print('faster-whisper', faster_whisper.__version__, 'PyAV', av.__version__)"
          "$MPY" "$HOME/Documents/video-edit/studio/app/studio/tools/np/model_fetch.py" --has && echo "the model is there"
          echo "$MPY" > "$HOME/mpy.txt"
          bash "$HOME/.claude/skills/edit-studio/scripts/setup.sh"
      - name: the noise cleaner for real (DPDFNet in the studio Python, the model from the package)
        run: |
          D="$HOME/Documents/video-edit/studio"
          PY="$D/py/Scripts/python.exe"
          "$PY" "$D/app/studio/voice/denoise.py" --version --models "$D/app/studio/voice/dpdfnet"
          ffmpeg -v error -y -f lavfi -i "sine=frequency=220:duration=3" -f lavfi -i "anoisesrc=color=pink:duration=3:amplitude=0.05" -filter_complex "[0:a][1:a]amix=inputs=2:normalize=0,pan=stereo|c0=c0|c1=c0" -ar 48000 -c:a pcm_f32le noisy.wav
          "$PY" "$D/app/studio/voice/denoise.py" noisy.wav clean.wav --models "$D/app/studio/voice/dpdfnet"
          "$PY" "$D/app/studio/voice/dereverb.py" noisy.wav wpe.wav
          "$PY" -c "import soundfile as sf; a=sf.info('noisy.wav'); b=sf.info('clean.wav'); print(a.frames, b.frames, b.channels, b.subtype); assert a.frames == b.frames and b.channels == 2"
      - name: the face tool the montage skill installs on Windows (mediapipe 0.10.21)
        run: |
          python -m pip install --quiet "mediapipe<0.10.30" numpy opencv-python-headless
          python -c "import mediapipe as m; m.solutions.face_detection; print('mediapipe', m.__version__)"
      - name: montage skill, setup check (what it says is missing on this machine)
        run: bash "$HOME/.claude/skills/video-edit/scripts/00_setup.sh" || echo "check exit $?"
      - name: start, status, info
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          bash "$S/start.sh" --no-open
          bash "$S/studio.sh" status
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          curl -s -m 30 "${URL}api/info" > info.json
          cut -c1-200 info.json; echo
          # الاستوديو المركّب يشوف كاشف الوجه على ويندوز (فتطلع أزرار الوجه)
          python -c "import json; d=json.load(open('info.json', encoding='utf-8')); print('platform', d.get('platform'), 'face', d.get('face')); assert d.get('face') is True"
      - name: the window of its own (0.9.7), the browser for it is found, the app page is served, and it opens
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          B="$(bash -c ". '$S/_common.sh'; app_browser_win")"
          echo "browser: $B"
          test -n "$B"
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          curl -s -m 30 -o app.webmanifest "${URL}studio/app.webmanifest"
          python -c "import json; d=json.load(open('app.webmanifest', encoding='utf-8')); print(d['display'], len(d['icons'])); assert d['display'] == 'standalone'"
          # افتحه مثل ما تفتحه الأيقونة، وتأكد إن فيه متصفح شغّال على عنوان الاستوديو بنافذة لحاله
          bash -c ". '$S/_common.sh'; open_url '$URL'"
          sleep 10
          N=$(powershell -NoProfile -Command 'Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*--app=http*" } | Measure-Object | Select-Object -ExpandProperty Count')
          echo "app windows: $N"
          test "${N:-0}" -ge 1
          taskkill //F //IM chrome.exe >/dev/null 2>&1 || true
          taskkill //F //IM msedge.exe >/dev/null 2>&1 || true
      - name: «مقطع جديد» on Windows (1.0.14) — the page offers it, and a clip opens from a video
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          # the page's own rule offers it on Windows (it was left hidden there before 1.0.14)
          curl -s -m 30 -o main.js "${URL}js/main.js"
          grep -q "win32" main.js
          ffmpeg -nostdin -v error -y -f lavfi -i testsrc2=size=360x640:rate=30:duration=6 -f lavfi -i "sine=f=220:d=6" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$HOME/clip-test.mp4"
          VIDEO="$(cygpath -w "$HOME/clip-test.mp4")" URL="$URL" PYTHONIOENCODING=utf-8 python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          url, video = os.environ['URL'], os.environ['VIDEO']
          def call(path, body=None):
              req = urllib.request.Request(url + path, data=None if body is None else json.dumps(body).encode('utf-8'),
                                           headers={'content-type': 'application/json'}, method='GET' if body is None else 'POST')
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.status, json.loads(r.read().decode('utf-8'))
          st, j = call('api/raw/start', {'path': video, 'name': 'تجربة ويندوز', 'mode': 'manual', 'face': 'none'})
          print('start', st, json.dumps(j))
          assert st == 202 and j.get('folder')
          folder = j['folder']
          for _ in range(120):
              st, lst = call('api/projects')
              e = next((p for p in lst.get('projects', []) if p.get('folder') == folder), None)
              if e and e.get('status') != 'preparing' and e.get('phase') != 'running':
                  print('ready', e.get('status'), e.get('phase'))
                  break
              time.sleep(1)
          else:
              raise SystemExit('the new clip never got ready: ' + json.dumps(e, ensure_ascii=False))
          st, pr = call('x/' + urllib.parse.quote(folder) + '/api/project')
          assert st == 200 and pr['project']['spine'], pr
          print('opened', len(pr['project']['spine']), 'clip(s)')
          PY
      - name: the file window in front, and a press after it never stuck (1.0.17) — a follower had «نافذة اختيار الملف مفتوحة» and no window
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          # the studio's own window in front, as he has it when he presses «مقطع جديد»
          bash -c ". '$S/_common.sh'; open_url '$URL'"
          sleep 10
          # Git's bash by its path (a bare «bash» from Python may be WSL's in System32)
          BASH_EXE="$(cygpath -w "$(command -v bash)")" URL="$URL" S="$S" PYTHONIOENCODING=utf-8 python - <<'PY'
          import ctypes, ctypes.wintypes as W, json, os, subprocess, threading, time, urllib.request
          url, u = os.environ['URL'], ctypes.windll.user32
          u.GetWindowLongW.restype = ctypes.c_long
          TITLE = 'Choose the videos'                      # the window's title for {lang: en, multiple: true}
          def press():
              out = {}
              def go():
                  req = urllib.request.Request(url + 'api/raw/pick', data=b'{"lang":"en","multiple":true}', headers={'content-type': 'application/json'}, method='POST')
                  with urllib.request.urlopen(req, timeout=300) as r:
                      out['status'], out['body'] = r.status, json.loads(r.read().decode('utf-8'))
              th = threading.Thread(target=go, daemon=True); th.start()
              return th, out
          def shown():                                     # every visible top window, top to bottom: (hwnd, title, pid)
              found = []
              @ctypes.WINFUNCTYPE(W.BOOL, W.HWND, W.LPARAM)
              def cb(h, _):
                  if u.IsWindowVisible(h):
                      n = u.GetWindowTextLengthW(h); b = ctypes.create_unicode_buffer(n + 1); u.GetWindowTextW(h, b, n + 1)
                      pid = W.DWORD(); u.GetWindowThreadProcessId(h, ctypes.byref(pid))
                      found.append((h, b.value, pid.value))
                  return True
              u.EnumWindows(cb, 0)
              return found
          def procs(name):
              r = subprocess.run(['tasklist', '/FI', f'IMAGENAME eq {name}', '/FO', 'CSV', '/NH'], capture_output=True, text=True)
              return {int(l.split('","')[1]) for l in r.stdout.splitlines() if l.startswith('"')}
          def dialogs(ms=20000):
              t0 = time.time()
              while time.time() - t0 < ms / 1000:
                  d = [w for w in shown() if w[1] == TITLE]
                  if d: return d
                  time.sleep(0.25)
              raise SystemExit('no file window on the screen. Visible windows: ' + json.dumps([w[1] for w in shown()], ensure_ascii=False))
          def above_studio(h):
              wins = shown(); browsers = procs('chrome.exe') | procs('msedge.exe')
              me = next(i for i, w in enumerate(wins) if w[0] == h)
              studio = [i for i, w in enumerate(wins) if w[2] in browsers and w[1]]
              ex = u.GetWindowLongW(h, -20)                # GWL_EXSTYLE; 0x8 = always on top
              print('window', h, 'z', me, 'studio z', studio[:3], 'topmost', bool(ex & 0x8), 'foreground', u.GetForegroundWindow() == h)
              assert studio, 'the studio window is not on the screen'
              assert me < min(studio), 'the file window is behind the studio window'
          # 1 the window shows above the studio's
          t1, o1 = press()
          d1 = dialogs()
          assert len(d1) == 1, d1
          above_studio(d1[0][0])
          # 2 he closes the studio's window (the server goes on) and opens it again, then presses: never «مفتوحة»
          subprocess.run(['taskkill', '/F', '/IM', 'chrome.exe'], capture_output=True); subprocess.run(['taskkill', '/F', '/IM', 'msedge.exe'], capture_output=True)
          subprocess.run([os.environ['BASH_EXE'], '-c', f". '{os.environ['S']}/_common.sh'; open_url '{url}'"]); time.sleep(10)
          t2, o2 = press()
          t1.join(30)
          print('press 1 answered', o1)
          assert o1.get('status') == 200 and o1['body'].get('replaced') is True, o1
          time.sleep(1.5)
          d2 = dialogs()
          assert len(d2) == 1 and d2[0][0] != d1[0][0], ('one new window', d1, d2)
          above_studio(d2[0][0])
          # 3 closed: an ordinary «canceled»
          u.PostMessageW(d2[0][0], 0x0010, 0, 0)          # WM_CLOSE
          t2.join(30)
          print('press 2 answered', o2)
          assert o2.get('status') == 200 and o2['body'] == {'canceled': True}, o2
          assert not [w for w in shown() if w[1] == TITLE], 'a file window was left on the screen'
          PY
          taskkill //F //IM chrome.exe >/dev/null 2>&1 || true
          taskkill //F //IM msedge.exe >/dev/null 2>&1 || true
      - name: «شكل السلسلة» on Windows (1.0.17) — a folder takes a clip's look, and a new clip in it starts from it
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          VIDEO="$(cygpath -w "$HOME/clip-test.mp4")" URL="$URL" PYTHONIOENCODING=utf-8 python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          url, video = os.environ['URL'], os.environ['VIDEO']
          def call(path, body=None, method=None):
              req = urllib.request.Request(url + path, data=None if body is None else json.dumps(body).encode('utf-8'),
                                           headers={'content-type': 'application/json'}, method=method or ('GET' if body is None else 'POST'))
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.status, json.loads(r.read().decode('utf-8'))
          def ready(folder):
              for _ in range(120):
                  st, lst = call('api/projects')
                  e = next((p for p in lst.get('projects', []) if p.get('folder') == folder), None)
                  if e and e.get('status') != 'preparing' and e.get('phase') != 'running':
                      return e
                  time.sleep(1)
              raise SystemExit('never ready: ' + folder)
          st, lst = call('api/projects')
          first = next(p for p in lst['projects'] if p.get('name') == 'تجربة ويندوز')['folder']
          q = 'x/' + urllib.parse.quote(first) + '/api/project'
          st, cur = call(q)
          pj = cur['project']; pj.setdefault('captions', {}).setdefault('style', {})['active'] = '#00FF88'
          st, saved = call(q, {'baseRev': cur['rev'], 'clientId': 'ci', 'label': 'ci', 'project': pj}, 'PUT')
          assert st == 200, saved
          st, fo = call('api/folders', {'name': 'سلسلة ويندوز'}); fid = fo['id']; print('folder', st, fid)
          st, j = call('api/folders/put', {'project': first, 'folder': fid}); assert st == 200, j
          st, j = call('api/folders/look', {'project': first}); print('look', st, json.dumps(j, ensure_ascii=False)); assert st == 200 and j.get('look'), j
          st, j = call('api/raw/start', {'path': video, 'name': 'حلقة ثانية', 'mode': 'manual', 'face': 'none', 'folder': fid})
          assert st == 202 and j.get('folder'), j
          e = ready(j['folder'])
          assert e.get('in') == fid, ('not in the folder', e)
          st, two = call('x/' + urllib.parse.quote(j['folder']) + '/api/project')
          got = two['project']['captions']['style'].get('active')
          print('the new clip starts with the series look:', got)
          assert got == '#00FF88', got
          PY
      - name: transcription on a machine with no model (1.0.16) — the studio fetches it itself, then the words come
        # a follower who only used the studio had no model and every transcription failed: the montage skill's Python,
        # an empty model cache, a sentence Windows says itself
        run: |
          D="$HOME/Documents/video-edit/studio"
          FPY="$(cat "$HOME/mpy.txt")"
          powershell -NoProfile -Command "Add-Type -AssemblyName System.Speech; \$s = New-Object System.Speech.Synthesis.SpeechSynthesizer; \$s.SetOutputToWaveFile('$(cygpath -w "$HOME/say.wav")'); \$s.Speak('Hello, this is a test of the studio on Windows.'); \$s.Dispose()"
          ffmpeg -nostdin -v error -y -i "$HOME/say.wav" -ar 48000 -c:a pcm_s24le "$HOME/say48.wav"
          echo '[{"i": 0, "s": 0.0, "e": 3.5}]' > "$HOME/isl.json"
          export HF_HOME="$HOME/hf-empty" HF_HUB_CACHE="$HOME/hf-empty/hub" PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          "$FPY" "$D/app/studio/tools/np/transcribe.py" "$(cygpath -w "$HOME/say48.wav")" "$(cygpath -w "$HOME/isl.json")" --model mlx-community/whisper-tiny-mlx --language en --ffmpeg ffmpeg > tr.jsonl
          grep -c '"model"' tr.jsonl || true
          tail -1 tr.jsonl | cut -c1-300
          PYTHONIOENCODING=utf-8 python -c "import json; L=[json.loads(x) for x in open('tr.jsonl', encoding='utf-8') if x.strip()]; assert any('model' in x for x in L), 'the model was not fetched'; w=[x for x in L if 'words' in x]; assert w and w[-1]['words'], L[-1]; print('words:', ' '.join(x['t'] for x in w[-1]['words']))"
      - name: a cut-short model download (1.0.17) — an empty snapshot is not «ready», it completes, the doctor says so, and a chatty child does not hang the fetch
        # Astra's review of 1.0.16 (1, 4): refs/main and an empty snapshot passed as the model; ensure() read the child's
        # stdout to its end before its stderr (Windows pipes are small)
        run: |
          D="$HOME/Documents/video-edit/studio"
          FPY="$(cat "$HOME/mpy.txt")"
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          H40="$(printf 'a%.0s' {1..40})"
          cut_short(){ local r="$1/hub/models--Systran--faster-whisper-$2"; mkdir -p "$r/refs" "$r/snapshots/$H40"; printf '%s' "$H40" > "$r/refs/main"; }
          cut_short "$HOME/hf-cut" large-v3
          HF_HOME="$HOME/hf-cut" HF_HUB_CACHE="$HOME/hf-cut/hub" bash "$D/app/scripts/doctor.sh" > doc-cut.txt || true
          grep "التفريغ" doc-cut.txt
          grep -q "نموذج التفريغ مو منزّل" doc-cut.txt
          cut_short "$HOME/hf-partial" tiny
          cd "$D/app/studio/tools/np"
          HF_HOME="$HOME/hf-partial" HF_HUB_CACHE="$HOME/hf-partial/hub" timeout 600 "$FPY" - <<'PY'
          import json, sys, subprocess, time, model_fetch as m
          repo, pats = m.repo_of('faster-whisper', 'mlx-community/whisper-tiny-mlx')
          assert not m.cached(repo, pats), 'an empty snapshot taken as ready'
          why = m.ensure('faster-whisper', 'mlx-community/whisper-tiny-mlx', lambda o: None)
          assert why is None and m.cached(repo, pats), why
          print('the cut-short download completed')
          real = subprocess.Popen
          child = 'import sys, json\nsys.stderr.write("w" * (1 << 20)); sys.stderr.flush()\nprint(json.dumps({"got": 1, "of": 1})); print(json.dumps({"done": True}))'
          m.subprocess = type('S', (), {'Popen': staticmethod(lambda a, **k: real([sys.executable, '-c', child], **k)), 'PIPE': subprocess.PIPE})
          n = [0]
          m.cached = lambda r, p: (n.__setitem__(0, n[0] + 1) or n[0] > 1)
          t = time.time()
          assert m.ensure('faster-whisper', 'large-v3', lambda o: None) is None
          print('1 MiB on stderr drained in %.1f s' % (time.time() - t))
          PY
      - name: transcription with the model the install brought (large-v3 on this machine's processor)
        run: |
          D="$HOME/Documents/video-edit/studio"
          FPY="$(cat "$HOME/mpy.txt")"
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          "$FPY" "$D/app/studio/tools/np/transcribe.py" "$(cygpath -w "$HOME/say48.wav")" "$(cygpath -w "$HOME/isl.json")" --language en --ffmpeg ffmpeg > tr2.jsonl
          tail -1 tr2.jsonl | cut -c1-300
          PYTHONIOENCODING=utf-8 python -c "import json; L=[json.loads(x) for x in open('tr2.jsonl', encoding='utf-8') if x.strip()]; assert not any('model' in x for x in L), 'downloaded again'; w=[x for x in L if 'words' in x]; assert w and w[-1]['words'], L[-1]; print('words:', ' '.join(x['t'] for x in w[-1]['words']))"
      - name: the words through the studio on Windows (1.0.17) — «مقطع جديد» gives the sentences, and «فرّغ الكلام الآن» on a clip by hand gives the words
        # followers on Windows: «ما تطلع الجمل ولا الكابشن». The steps above run the transcriber alone; this one goes the way they
        # do, through the studio (analyze for «اختر الجمل», POST /api/cut/transcribe for the captions button), with the model the
        # install brought. The voice is English (the machine's own), so the language is set to English for it
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          D="$HOME/Documents/video-edit/studio"
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          powershell -NoProfile -Command "Add-Type -AssemblyName System.Speech; \$s = New-Object System.Speech.Synthesis.SpeechSynthesizer; \$s.Rate = -1; \$s.SetOutputToWaveFile('$(cygpath -w "$HOME/words.wav")'); \$s.Speak('Hello, this is the studio on Windows. Today we try the sentences and the captions.'); \$s.Dispose()"
          ffmpeg -nostdin -v error -y -i "$HOME/words.wav" -f lavfi -i testsrc2=size=360x640:rate=30 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 48000 "$HOME/words.mp4"
          PYTHONIOENCODING=utf-8 python -c "import json, os; f=os.path.join(r'$(cygpath -w "$D/home")', 'prefs.json'); p=json.load(open(f, encoding='utf-8')) if os.path.exists(f) else {}; p.setdefault('transcribe', {})['language'] = 'en'; json.dump(p, open(f, 'w', encoding='utf-8'), ensure_ascii=False); print('prefs', p['transcribe'])"
          VIDEO="$(cygpath -w "$HOME/words.mp4")" URL="$URL" PYTHONIOENCODING=utf-8 python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          url, video = os.environ['URL'], os.environ['VIDEO']
          def call(path, body=None, timeout=60):
              req = urllib.request.Request(url + path, data=None if body is None else json.dumps(body).encode('utf-8'),
                                           headers={'content-type': 'application/json'}, method='GET' if body is None else 'POST')
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode('utf-8') or '{}')
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode('utf-8') or '{}')
              except (urllib.error.URLError, TimeoutError, ConnectionError) as e:
                  return 0, {'error': str(e)}
          def cut(folder):
              return call('x/' + urllib.parse.quote(folder) + '/api/cut')
          def until(folder, done, what, secs):
              t0, last, c = time.time(), 0, {}
              while time.time() - t0 < secs:
                  st, c = cut(folder)
                  if st == 200 and done(c):
                      return c
                  if st == 200 and c.get('state') == 'stalled':
                      raise SystemExit(f'{what}: the preparation stopped: ' + json.dumps(c, ensure_ascii=False)[:1500])
                  if st == 200 and c.get('hearFail'):
                      raise SystemExit(f'{what}: the hearing failed: ' + json.dumps(c, ensure_ascii=False)[:1500])
                  if time.time() - last > 30:
                      last = time.time(); print(f'  {what}: {int(last - t0)} s', c.get('state'), c.get('step'), c.get('pct'), flush=True)
                  time.sleep(2)
              raise SystemExit(f'{what}: not done in {secs} s: ' + json.dumps(c, ensure_ascii=False)[:1500])
          def start(name, mode):
              st, j = call('api/raw/start', {'path': video, 'name': name, 'mode': mode, 'face': 'none'})
              print('start', mode, st, json.dumps(j, ensure_ascii=False))
              assert st == 202 and j.get('folder'), j
              return j['folder']
          # 1 «مقطع جديد», the whole montage: the sentences come for «اختر الجمل»
          t0 = time.time()
          f1 = start('جمل ويندوز', 'full')
          c = until(f1, lambda c: c.get('state') == 'ready', 'the sentences', 1200)
          said = [i['text'] for i in c.get('islands', []) if i.get('text', '').strip()]
          print(f'sentences after {int(time.time() - t0)} s:', len(said), json.dumps(said, ensure_ascii=False), '| heard', c.get('heard'))
          assert said, 'no sentences: ' + json.dumps(c, ensure_ascii=False)[:1500]
          # 2 by hand, then «فرّغ الكلام الآن»: the words the captions get
          t0 = time.time()
          f2 = start('كابشن ويندوز', 'manual')
          until(f2, lambda c: c.get('state') == 'noWords', 'the clip by hand', 300)
          st, j = call('x/' + urllib.parse.quote(f2) + '/api/cut/transcribe', {})
          print('transcribe', st, j)
          assert st == 202, j
          c = until(f2, lambda c: c.get('state') == 'ready' and (c.get('heard') or {}).get('words', 0) > 0, 'the words', 1200)
          said = [i['text'] for i in c.get('islands', []) if i.get('text', '').strip()]
          print(f'words after {int(time.time() - t0)} s:', c.get('heard'), json.dumps(said, ensure_ascii=False))
          assert (c.get('heard') or {}).get('ok') is True, c.get('heard')
          PY
      - name: desktop shortcut
        shell: pwsh
        run: |
          $l = Join-Path $HOME "Desktop/B Studio.lnk"
          if (!(Test-Path $l)) { throw "no shortcut on the desktop" }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($l)
          "target: $($s.TargetPath)"; "icon: $($s.IconLocation)"
          if ($s.IconLocation -notmatch "icon\.ico") { throw "the shortcut has no studio icon" }
          if (!(Test-Path ($s.IconLocation -replace ",\d+$", ""))) { throw "the icon file is not there" }
      - name: update from the public repository (check, then a real update over a changed copy)
        run: |
          U="$HOME/.claude/skills/edit-studio/scripts/update.sh"
          bash "$U" --check
          echo "# an older copy" >> "$HOME/.claude/skills/edit-studio/SKILL.md"
          bash "$U" | tee /tmp/update.log
          grep -q "↺ edit-studio" /tmp/update.log
          ! grep -q "an older copy" "$HOME/.claude/skills/edit-studio/SKILL.md"
          ls "$HOME/edit-studio-old"
      - name: the guide is on the Desktop
        run: ls -la "$HOME/Desktop/" && test -f "$HOME/Desktop/دليل B Studio.pdf"
      - name: doctor
        if: always()
        run: bash "$HOME/Documents/video-edit/studio/app/scripts/doctor.sh" || echo "doctor exit $?"
      - name: stop
        if: always()
        run: bash "$HOME/Documents/video-edit/studio/app/scripts/studio.sh" stop || true
      - name: server log
        if: always()
        run: tail -n 30 "$HOME/Documents/video-edit/studio/server.log" 2>/dev/null || true
