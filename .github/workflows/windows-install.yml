              await until(async () => {
                if ((await title()) === T.review) { console.log('the checks:', await page.evaluate(() => [...document.querySelectorAll('.dialog li')].map((e) => e.textContent).join(' | '))); await press(T.anyway); }
                return page.evaluate(() => { const r = document.querySelector('.ex-run'); return !!r && !r.hidden; });
              }, 300000, 'the export started');
              console.log('exporting', name);
              // P8: closing the window while the export runs (its frames going out) asks first, the line names the export, «stay» keeps it going
              await until(() => page.evaluate(async () => (await import('/js/ui/close-guard.js')).losses(window.__mohrer.ctx).includes('export')), 120000, 'the export running in the page');
              let asked = null;
              const onDialog = (dl) => { asked = dl.type(); dl.dismiss().catch(() => {}); };
              page.on('dialog', onDialog);
              await page.close({ runBeforeUnload: true });
              await sleep(1500);
              page.off('dialog', onDialog);
              console.log('closing during the export:', JSON.stringify({ asked, closed: page.isClosed() }));
              if (asked !== 'beforeunload' || page.isClosed()) return fail('closing during the export did not ask');
              const line = await until(() => page.evaluate(() => [...document.querySelectorAll('.toast')].map((e) => e.textContent).find((x) => /التصدير/.test(x)) || ''), 10000, 'the line naming the export');
              console.log('the line:', line);
              await until(async () => {
                const w = await page.evaluate(() => [...document.querySelectorAll('.ex-warn li')].map((e) => e.textContent));
                if ((await title()) !== T.done && w.length && !(await page.evaluate(() => { const r = document.querySelector('.ex-run'); return !!r && !r.hidden; }))) throw new Error('the export stopped: ' + w.join(' | '));
                return (await title()) === T.done;
              }, 1800000, 'the export');
              console.log(`exported in ${secs(t0)} s; the sheet says:`, await page.evaluate(() => [...document.querySelectorAll('.ex-warn li')].map((e) => e.textContent).join(' | ') || '(nothing to warn)'));
              if (errors.length) console.log('page errors:', errors.join(' | '));

              // 7 the file
              const out = path.join(dir, 'out');
              const file = path.join(out, `${name}.mp4`);
              console.log('out/:', fs.readdirSync(out).join(' | '));
              if (!fs.existsSync(file) || fs.readdirSync(out).some((f) => f.endsWith('.part'))) return fail('no finished file');
              const pr = JSON.parse(spawnSync('ffprobe', ['-v', 'error', '-show_entries', 'stream=codec_type,codec_name,nb_frames,duration,width,height', '-of', 'json', file], { encoding: 'utf8' }).stdout).streams;
              const v = pr.find((s) => s.codec_type === 'video'), a = pr.find((s) => s.codec_type === 'audio');
              const want = L.total / L.fps;
              console.log('the file:', JSON.stringify(pr), '| the timeline', L.total, 'frames,', want.toFixed(2), 's');
              if (!v || v.codec_name !== 'h264' || Number(v.nb_frames) !== L.total) return fail('not every frame (or not H.264)');
              if (Math.abs(Number(v.duration) - want) > 0.1 || !a || Math.abs(Number(a.duration) - want) > 0.15) return fail('the picture or the sound is not as long as the timeline');
              const vol = spawnSync('ffmpeg', ['-v', 'info', '-ss', '5', '-t', String(want - 10), '-i', file, '-af', 'volumedetect', '-f', 'null', '-'], { encoding: 'utf8' });
              const mean = Number((/mean_volume: (-?[\d.]+) dB/.exec(vol.stderr) || [])[1]);
              console.log('its sound:', mean, 'dB');
              if (!(mean > -60)) return fail('the sound is silent');
              // the drawing: in its seconds (the bar full by its middle), never before or after
              const [W, H] = [Number(v.width), Number(v.height)];
              const [s0, s1] = L.at ? [L.at[0] / L.fps, L.at[1] / L.fps] : [1, 3];
              const red = [s0 - 0.5, s0 + 1.5, s1 + 0.5].map((t) => frameAt(file, t, W, H)[1]);
              console.log(`the drawing (${s0.toFixed(2)}–${s1.toFixed(2)} s), share of red: before ${red[0].toFixed(4)}, in it ${red[1].toFixed(4)}, after ${red[2].toFixed(4)}`);
              if (!(red[1] > 0.02 && red[0] < 0.001 && red[2] < 0.001)) return fail('the drawing is not in its seconds');
              // the source got 7 levels brighter a second (video levels 0 → 245 over 35 s, read back as full-range RGB): at export
              // second e the picture is the source's second e × speed, or (reversed) its length less that: brightest first, then darker
              const { rev: back, speed } = await clip();
              const ts = []; for (let e = 4; e < want - 1; e += 6) ts.push(e);
              const ys = ts.map((e) => frameAt(file, e, W, H)[0]);
              const exp = ts.map((e) => { const s = back ? srcDur - e * speed : e * speed; return Math.min(255, Math.max(0, ((7 * s - 16) * 255) / 219)); });
              console.log(`brightness by second (${back ? 'backwards' : 'forwards'}, ${speed}×):`, ts.map((e, i) => `${e}s ${ys[i].toFixed(0)}/${exp[i].toFixed(0)}`).join(' · '));
              const way = back ? -1 : 1;
              if (!(way * (ys[ys.length - 1] - ys[0]) > 100)) return fail(`the picture does not run ${back ? 'backwards' : 'forwards'}`);
              if (ys.some((y, i) => i && way * (y - ys[i - 1]) < -3)) return fail('the brightness turns back somewhere: not one way all along');
              if (ys.some((y, i) => exp[i] > 30 && exp[i] < 220 && Math.abs(y - exp[i]) > 25)) return fail(`not at ${speed}× (a second of the source is not where it should be)`);
              await b.close();
              console.log('PASSED');
            } catch (e) { await fail(e && e.stack || e); }
          })();
          JS
          PP="$(cygpath -w "$HOME/pp/node_modules/puppeteer-core")" CHROME="$(cygpath -w "$B")" URL="$URL" VIDEO="$(cygpath -w "$HOME/ramp35.mp4")" NAME='تصدير ويندوز كامل' MCP="$(cygpath -w "$HOME/Documents/video-edit/studio/app/studio/tools/studio-mcp.mjs")" PYTHONIOENCODING=utf-8 node "$(cygpath -w "$HOME/export_check.cjs")"
          taskkill //F //IM chrome.exe >/dev/null 2>&1 || true
      - name: the window raise takes any clip name (audit 1.0.19, S6) — «Ali’s vlog» is found by its title, and a name made to end PowerShell's quote runs nothing through the studio (it does in the form used before 1.0.22)
        run: |
