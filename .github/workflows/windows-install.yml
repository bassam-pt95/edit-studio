              console.log('the timeline:', JSON.stringify(L));
              const T = await hook((m) => ({ exp: m.t('hd.export'), go: m.t('ex.go'), done: m.t('ex.done'), review: m.t('pf.title'), anyway: m.t('pf.anyway') }));
              // a real mouse press on the button (Chrome asks before closing only a page he has pressed in)
              const press = async (label) => {
                const el = (await page.evaluateHandle((s) => [...document.querySelectorAll('button')].find((x) => x.offsetParent !== null && x.textContent.trim() === s) || null, label)).asElement();
                if (!el) return false;
                await el.click();
                return true;
              };
              if (!(await press(T.exp))) return fail(`no «${T.exp}» button`);
              await page.waitForFunction(() => document.querySelector('#ex-name') && document.querySelector('#ex-name').value.length > 0, { timeout: 20000 });
              const name = await page.$eval('#ex-name', (e) => e.value);
              // 1.0.24: no draft on Windows (draft: null): the two choices and no line about a draft under them (followers
              // read «المسودة السريعة غير متاحة على هذا الجهاز» as a third choice gone missing)
              await page.waitForSelector('.ex-kind', { timeout: 10000 });
              const sheet = await page.evaluate(() => { const w = window.__mohrer.t('ex.err.noDraft'); const l = [...document.querySelectorAll('.ex-hint')].find((e) => e.textContent === w); return { kinds: [...document.querySelectorAll('.ex-kind [data-value]')].map((e) => e.dataset.value), line: !!l && !l.hidden && l.offsetParent !== null }; });
              console.log('the sheet:', JSON.stringify(sheet));
              if (sheet.line) return fail('«المسودة السريعة غير متاحة» shows under the choices on a machine with no draft');
              t0 = Date.now();
              if (!(await press(T.go))) return fail(`no «${T.go}» in the export sheet`);
              const title = () => page.evaluate(() => (document.querySelector('.ex-dialog .dialog-title, .dialog-title') || {}).textContent || '');
              await until(async () => {
                if ((await title()) === T.review) { console.log('the checks:', await page.evaluate(() => [...document.querySelectorAll('.dialog li')].map((e) => e.textContent).join(' | '))); await press(T.anyway); }
                return page.evaluate(() => { const r = document.querySelector('.ex-run'); return !!r && !r.hidden; });
              }, 300000, 'the export started');
              console.log('exporting', name);
              // P8: closing the window while the export runs (its frames going out) asks first, the line names the export, «stay» keeps it going
              await until(() => page.evaluate(async () => (await import('/js/ui/close-guard.js')).losses(window.__mohrer.ctx).includes('export')), 120000, 'the export running in the page');
              let asked = null;
              const onDialog = (dl) => { asked = dl.type(); dl.dismiss().catch(() => {}); };
              page.on('dialog', onDialog);
              await page.close({ runBeforeUnload: true });
              await sleep(1500);
              page.off('dialog', onDialog);
              console.log('closing during the export:', JSON.stringify({ asked, closed: page.isClosed() }));
              if (asked !== 'beforeunload' || page.isClosed()) return fail('closing during the export did not ask');
              const line = await until(() => page.evaluate(() => [...document.querySelectorAll('.toast')].map((e) => e.textContent).find((x) => /التصدير/.test(x)) || ''), 10000, 'the line naming the export');
              console.log('the line:', line);
              // GitHub #4 (1.0.24): the encode check's own numbers, every run. A picture it refuses now fails the export
              // (run 41628747869 ended «صُدِّر الفيديو، لكن فحص الجودة وجد فرقاً: جودة ترميز الصورة» and passed): these say where
              const rows = () => { try { const r = path.join(dir, 'render'); const v = fs.readdirSync(r).map((n) => path.join(r, n, 'verify.json')).filter((f) => fs.existsSync(f)).sort((a, b) => fs.statSync(b).mtimeMs - fs.statSync(a).mtimeMs)[0]; if (!v) return console.log('verify.json: none'); const j = JSON.parse(fs.readFileSync(v, 'utf8')); const e = (j.checks || []).find((c) => c.name === 'encode'); console.log('verify:', j.ok ? 'ok' : `failed ${j.failed}`, '| encode rows [frame, psnr, raw, aligned]:', JSON.stringify(((e && e.detail) || []).map((q) => [q.n, q.psnr, q.raw, q.aligned]))); } catch (err) { console.log('verify.json:', String(err && err.message || err)); } };
              await until(async () => {
                const w = await page.evaluate(() => [...document.querySelectorAll('.ex-warn li')].map((e) => e.textContent));
                if ((await title()) !== T.done && w.length && !(await page.evaluate(() => { const r = document.querySelector('.ex-run'); return !!r && !r.hidden; }))) { rows(); throw new Error('the export stopped: ' + w.join(' | ')); }
                return (await title()) === T.done;
              }, 1800000, 'the export');
              console.log(`exported in ${secs(t0)} s; the sheet says:`, await page.evaluate(() => [...document.querySelectorAll('.ex-warn li')].map((e) => e.textContent).join(' | ') || '(nothing to warn)'));
              rows();
              if (errors.length) console.log('page errors:', errors.join(' | '));

              // 7 the file
              const out = path.join(dir, 'out');
              const file = path.join(out, `${name}.mp4`);
              console.log('out/:', fs.readdirSync(out).join(' | '));
              if (!fs.existsSync(file) || fs.readdirSync(out).some((f) => f.endsWith('.part'))) return fail('no finished file');
              const pr = JSON.parse(spawnSync('ffprobe', ['-v', 'error', '-show_entries', 'stream=codec_type,codec_name,nb_frames,duration,width,height', '-of', 'json', file], { encoding: 'utf8' }).stdout).streams;
              const v = pr.find((s) => s.codec_type === 'video'), a = pr.find((s) => s.codec_type === 'audio');
              const want = L.total / L.fps;
              console.log('the file:', JSON.stringify(pr), '| the timeline', L.total, 'frames,', want.toFixed(2), 's');
              if (!v || v.codec_name !== 'h264' || Number(v.nb_frames) !== L.total) return fail('not every frame (or not H.264)');
              if (Math.abs(Number(v.duration) - want) > 0.1 || !a || Math.abs(Number(a.duration) - want) > 0.15) return fail('the picture or the sound is not as long as the timeline');
              const vol = spawnSync('ffmpeg', ['-v', 'info', '-ss', '5', '-t', String(want - 10), '-i', file, '-af', 'volumedetect', '-f', 'null', '-'], { encoding: 'utf8' });
              const mean = Number((/mean_volume: (-?[\d.]+) dB/.exec(vol.stderr) || [])[1]);
              console.log('its sound:', mean, 'dB');
              if (!(mean > -60)) return fail('the sound is silent');
              // the drawing: in its seconds (the bar full by its middle), never before or after
              const [W, H] = [Number(v.width), Number(v.height)];
              const [s0, s1] = L.at ? [L.at[0] / L.fps, L.at[1] / L.fps] : [1, 3];
              const red = [s0 - 0.5, s0 + 1.5, s1 + 0.5].map((t) => frameAt(file, t, W, H)[1]);
              console.log(`the drawing (${s0.toFixed(2)}–${s1.toFixed(2)} s), share of red: before ${red[0].toFixed(4)}, in it ${red[1].toFixed(4)}, after ${red[2].toFixed(4)}`);
              if (!(red[1] > 0.02 && red[0] < 0.001 && red[2] < 0.001)) return fail('the drawing is not in its seconds');
              // the source got 7 levels brighter a second (video levels 0 → 245 over 35 s, read back as full-range RGB): at export
              // second e the picture is the source's second e × speed, or (reversed) its length less that: brightest first, then darker
              const { rev: back, speed } = await clip();
              const ts = []; for (let e = 4; e < want - 1; e += 6) ts.push(e);
              const ys = ts.map((e) => frameAt(file, e, W, H)[0]);
              const exp = ts.map((e) => { const s = back ? srcDur - e * speed : e * speed; return Math.min(255, Math.max(0, ((7 * s - 16) * 255) / 219)); });
              console.log(`brightness by second (${back ? 'backwards' : 'forwards'}, ${speed}×):`, ts.map((e, i) => `${e}s ${ys[i].toFixed(0)}/${exp[i].toFixed(0)}`).join(' · '));
              const way = back ? -1 : 1;
              if (!(way * (ys[ys.length - 1] - ys[0]) > 100)) return fail(`the picture does not run ${back ? 'backwards' : 'forwards'}`);
              if (ys.some((y, i) => i && way * (y - ys[i - 1]) < -3)) return fail('the brightness turns back somewhere: not one way all along');
              if (ys.some((y, i) => exp[i] > 30 && exp[i] < 220 && Math.abs(y - exp[i]) > 25)) return fail(`not at ${speed}× (a second of the source is not where it should be)`);
              await b.close();
              console.log('PASSED');
            } catch (e) { await fail(e && e.stack || e); }
          })();
          JS
          PP="$(cygpath -w "$HOME/pp/node_modules/puppeteer-core")" CHROME="$(cygpath -w "$B")" URL="$URL" VIDEO="$(cygpath -w "$HOME/ramp35.mp4")" NAME='تصدير ويندوز كامل' MCP="$(cygpath -w "$HOME/Documents/video-edit/studio/app/studio/tools/studio-mcp.mjs")" PYTHONIOENCODING=utf-8 node "$(cygpath -w "$HOME/export_check.cjs")" || { { grep '^\[export\] ' "$HOME/Documents/video-edit/studio/server.log" || true; } | tail -n 5; taskkill //F //IM chrome.exe >/dev/null 2>&1; exit 1; }
          # 1.0.24 (the Windows report of a slow export): how this export went, as the studio's log says it every 30 s
          # (frames, the time a frame takes and where, the parts, the sources and their decode, memory, the page's GPU)
          { grep '^\[export\] ' "$HOME/Documents/video-edit/studio/server.log" || true; } | tail -n 5
          grep -q '^\[export\] تصدير ويندوز كامل' "$HOME/Documents/video-edit/studio/server.log" || { echo "FAILED: no [export] line in the log during a 7-minute export"; exit 1; }
          taskkill //F //IM chrome.exe >/dev/null 2>&1 || true
      - name: the writing templates (1.0.26; the four for everyone, 1.0.27) — a centred title in Latin and in Arabic and two names; with no pack the four only; «تصدير» pressed; the words in the file in their seconds, as wide as drawn and in the middle
        run: |
          S="$HOME/Documents/video-edit/studio/app/scripts"
          URL="$(bash "$S/studio.sh" status | sed -n 's/^running: //p')"
          B="$(bash -c ". '$S/_common.sh'; app_browser_win")"
          [ -d "$HOME/pp/node_modules/puppeteer-core" ] || npm install --prefix "$HOME/pp" --no-save --no-audit --no-fund puppeteer-core@25.11.0 >/dev/null
          ffmpeg -nostdin -v error -y -f lavfi -i "color=c=0x303845:s=540x960:r=30:d=16,format=yuv420p" -f lavfi -i "sine=f=330:d=16" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$HOME/tpl16.mp4"
          cat > "$HOME/templates_check.cjs" <<'JS'
          // §84 on this machine: the four ready templates, exported the way he exports (no pack here: §88, the four only).
          // env: PP (puppeteer-core's folder), CHROME, URL (the running studio), VIDEO (the clip), NAME (its name), MCP (studio-mcp.mjs)
          const pptr = require(process.env.PP);
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawn, spawnSync } = require('node:child_process');
          const url = process.env.URL.replace(/\/+$/, '');
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const call = async (p, body) => { const r = await fetch(url + p, { method: body === undefined ? 'GET' : 'POST', headers: { 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) }); return { status: r.status, body: await r.json().catch(() => ({})) }; };
          async function until(fn, ms, what) { const t0 = Date.now(); for (;; await sleep(500)) { const v = await fn(); if (v) return v; if (Date.now() - t0 > ms) throw new Error(`${what}: not in ${Math.round(ms / 1000)} s`); } }
          function tools(env) {
            const c = spawn(process.execPath, [process.env.MCP], { env: { ...process.env, ...env }, stdio: ['pipe', 'pipe', 'pipe'] });
            let buf = '', id = 0, err = '';
            const waiters = new Map();
            c.stderr.on('data', (d) => { err += d; });
            c.stdout.on('data', (d) => { buf += d; for (let i = buf.indexOf('\n'); i >= 0; i = buf.indexOf('\n')) { const line = buf.slice(0, i); buf = buf.slice(i + 1); let m = null; try { m = JSON.parse(line); } catch { continue; } const w = waiters.get(m.id); if (w) { waiters.delete(m.id); w(m); } } });
            const rpc = (method, params) => new Promise((r) => { id += 1; waiters.set(id, r); c.stdin.write(`${JSON.stringify({ jsonrpc: '2.0', id, method, params })}\n`); });
            return {
              hello: () => rpc('initialize', { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'windows-check', version: '0' } }),
              list: () => rpc('tools/list', {}),
              async call(name, args) { const r = await rpc('tools/call', { name, arguments: args }); const content = (r.result && r.result.content) || []; return { text: content.filter((x) => x.type === 'text').map((x) => x.text).join('\n'), isError: !!(r.result && r.result.isError), log: err.slice(-800) }; },
              stop: () => c.kill(),
            };
          }
          // the light letters (the four write in the clip's caption colour, near white) in a frame of the file at t: their share and the columns they span
          function cream(file, t, W, H) {
            const rgb = spawnSync('ffmpeg', ['-v', 'error', '-ss', t.toFixed(3), '-i', file, '-frames:v', '1', '-f', 'rawvideo', '-pix_fmt', 'rgb24', '-'], { maxBuffer: 64 << 20 }).stdout;
            if (!rgb || rgb.length < W * H * 3) throw new Error(`no frame at ${t} s`);
            let n = 0, x0 = W, x1 = -1, sat = 0, m = 0;
            for (let i = 0; i < W * H; i++) {
              const r = rgb[i * 3], g = rgb[i * 3 + 1], b = rgb[i * 3 + 2], x = i % W;
              if (r > 205 && g > 195 && b > 175 && r - b < 45) { n++; if (x < x0) x0 = x; if (x > x1) x1 = x; }
              if (((i / W) | 0) < H * 0.3) { sat += Math.max(r, g, b) - Math.min(r, g, b); m++; }
            }
            return { share: n / (W * H), x0, x1, sat: sat / m };
          }
          // the same light letters in the drawing itself: frame n of the block file (its top half is the picture, cropped to box), in the
          // video's own pixels → the columns the letters span (the box is wider: it holds their soft shadow too)
          function drawnCream(file, n, box) {
            const [bx, , bw, bh] = box;
            const rgb = spawnSync('ffmpeg', ['-v', 'error', '-i', file, '-vf', `select=eq(n\\,${n}),crop=${bw}:${bh}:0:0`, '-frames:v', '1', '-f', 'rawvideo', '-pix_fmt', 'rgb24', '-'], { maxBuffer: 64 << 20 }).stdout;
            if (!rgb || rgb.length < bw * bh * 3) throw new Error(`no frame ${n} in ${file}`);
            let x0 = bw, x1 = -1;
            for (let i = 0; i < bw * bh; i++) { const r = rgb[i * 3], g = rgb[i * 3 + 1], b = rgb[i * 3 + 2], x = i % bw; if (r > 205 && g > 195 && b > 175 && r - b < 45) { if (x < x0) x0 = x; if (x > x1) x1 = x; } }
            return { x0: bx + x0, x1: bx + x1 };
          }
          (async () => {
            const prof = fs.mkdtempSync(path.join(require('node:os').tmpdir(), 'tpl-chrome-'));
            const own = process.env.CHROME_HOME ? { USERPROFILE: process.env.CHROME_HOME, HOME: process.env.CHROME_HOME } : {};
            const b = await pptr.launch({ executablePath: process.env.CHROME, headless: true, userDataDir: prof, timeout: 120000, env: { ...process.env, ...own }, args: ['--no-first-run', '--no-default-browser-check', '--ignore-gpu-blocklist'] });
            const fail = async (why) => { console.error('FAILED:', why); await b.close().catch(() => {}); process.exit(1); };
            try {
              const st = await call('/api/raw/start', { path: process.env.VIDEO, name: process.env.NAME, mode: 'manual', face: 'none' });
              if (st.status !== 202 || !st.body.folder) return fail(`the clip did not start: ${st.status} ${JSON.stringify(st.body)}`);
              const folder = st.body.folder, x = `/x/${encodeURIComponent(folder)}`;
              await until(async () => { const l = (await call('/api/projects')).body; const e = (l.projects || []).find((p) => p.folder === folder); return e && e.status !== 'preparing' && e.phase !== 'running'; }, 300000, 'the clip ready');
              const dir = path.join((await call('/api/info')).body.root, folder);
              const page = await b.newPage();
              try { await page._client().send('Network.disable'); } catch { /* another puppeteer */ }
              await page.setViewport({ width: 1280, height: 800 });
              await page.goto(`${url}/?p=${encodeURIComponent(folder)}&test=1`, { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => window.__mohrer && window.__mohrer.ready === true, { timeout: 120000 });
              const hook = (fn, ...a) => page.evaluate(`(${fn})(window.__mohrer, ...${JSON.stringify(a)})`);
              const project = async () => (await call(`${x}/api/project`)).body.project;
              const mcp = tools({ STUDIO_DIR: dir, STUDIO_BASE: url + x, STUDIO_SOUNDS: '' });
              await mcp.hello();
              // two shots: the clip cut at 8 s (the first one goes black and white below, the second keeps its colour)
              const cut = await mcp.call('apply', { operations: [{ name: 'blade', args: { f: 240 } }], summary: 'two shots' });
              if (cut.isError || (await project()).spine.length !== 2) return fail(`the clip was not cut in two: ${cut.text}`);
              const placed = {};
              // 1 the templates
              for (const [k, args] of [['latin', { template: 'center', text: { title: 'Forever begins tonight' }, at: 0.5 }], ['names', { template: 'names', text: { a: 'Omar', b: 'Layla', date: '01 . 01 . 2027' }, at: 5 }], ['arabic', { template: 'center', text: { title: 'وبدأت الحكاية' }, at: 10.5 }]]) {
                const r = await mcp.call('title', args);
                const item = (/item (x_\w+)/.exec(r.text) || [])[1];
                console.log(`title ${k}:`, r.text.split('\n').filter((l) => !/^the video at/.test(l)).join(' | ').slice(0, 300));
                if (r.isError || !item) return fail(`title ${k}: ${r.text} ${r.log}`);
                placed[k] = item;
              }
              let p = await project();
              const boxOf = (id) => { const it = p.attached.find((a) => a.id === id); return p.assets[it.asset].recipe.box; };
              const u = Math.min(p.width, p.height) / 1080;
              // 2 no pack on this machine (§88): nothing listed, the four only, no pack_action
              const packs = (await call('/api/packs')).body;
              console.log('/api/packs:', JSON.stringify(packs));
              if (!packs || !Array.isArray(packs.pieces) || packs.pieces.length) return fail(`/api/packs lists a pack: ${JSON.stringify(packs)}`);
              const listed = ((await mcp.list()).result || {}).tools || [];
              const en = ((listed.find((x) => x.name === 'title') || {}).inputSchema || { properties: { template: {} } }).properties.template.enum;
              if (listed.some((x) => x.name === 'pack_action') || JSON.stringify(en) !== JSON.stringify(['center', 'lower', 'names', 'quote'])) return fail(`the tools: pack_action ${listed.some((x) => x.name === 'pack_action')}, templates ${JSON.stringify(en)}`);
              mcp.stop();
              p = await project();
              const ids = p.attached.map((a) => a.id);
              await until(() => hook((m, want) => want.every((id) => m.store.state.p.attached.some((a) => a.id === id)), ids), 60000, 'the templates on the page');
              // (NO_EXPORT: the Mac's run before the release, when exports wait: stops here)
              if (process.env.NO_EXPORT === '1') { await b.close(); console.log('PASSED (no export)'); return; }
              // 3 «تصدير», the way he presses it
              await hook((m) => m.sync && m.sync.flush && m.sync.flush());
              const L = await hook((m) => { const pp = m.store.state.p; return { total: m.store.state.L.total, fps: pp.fps[0] / pp.fps[1], at: Object.fromEntries(pp.attached.map((a) => [a.id, [m.store.state.L.index.get(a.id).start, m.store.state.L.index.get(a.id).end]])) }; });
              const T = await hook((m) => ({ exp: m.t('hd.export'), go: m.t('ex.go'), done: m.t('ex.done'), review: m.t('pf.title'), anyway: m.t('pf.anyway') }));
              const press = async (label) => { const el = (await page.evaluateHandle((s) => [...document.querySelectorAll('button')].find((e) => e.offsetParent !== null && e.textContent.trim() === s) || null, label)).asElement(); if (!el) return false; await el.click(); return true; };
              if (!(await press(T.exp))) return fail(`no «${T.exp}» button`);
              await page.waitForFunction(() => document.querySelector('#ex-name') && document.querySelector('#ex-name').value.length > 0, { timeout: 20000 });
              const name = await page.$eval('#ex-name', (e) => e.value);
              if (!(await press(T.go))) return fail(`no «${T.go}»`);
              const title = () => page.evaluate(() => (document.querySelector('.ex-dialog .dialog-title, .dialog-title') || {}).textContent || '');
              await until(async () => { if ((await title()) === T.review) await press(T.anyway); return (await title()) === T.done; }, 1200000, 'the export');
              const file = path.join(dir, 'out', `${name}.mp4`);
              if (!fs.existsSync(file)) return fail('no file');
              const v = JSON.parse(spawnSync('ffprobe', ['-v', 'error', '-select_streams', 'v:0', '-show_entries', 'stream=nb_frames,width,height', '-of', 'json', file], { encoding: 'utf8' }).stdout).streams[0];
              const W = Number(v.width), H = Number(v.height), sx = W / p.width;
              console.log('the file:', JSON.stringify(v), 'the timeline', L.total);
              if (Number(v.nb_frames) !== L.total) return fail('not every frame');
              // the words in their seconds, as wide as drawn, in the middle
              for (const k of ['latin', 'arabic', 'names']) {
                const [f0, f1] = L.at[placed[k]], mid = ((f0 + f1) / 2) / L.fps;
                const c = cream(file, mid, W, H), box = boxOf(placed[k]);
                const it = p.attached.find((a) => a.id === placed[k]), d = drawnCream(path.join(dir, p.assets[it.asset].file), Math.round((f1 - f0) / 2), box);
                const want = (d.x1 - d.x0 + 1) * sx, got = c.x1 - c.x0 + 1, centre = (c.x0 + c.x1) / 2 / W, shift = Math.abs(c.x0 - d.x0 * sx) / W;
                console.log(`${k} at ${mid.toFixed(2)} s: cream ${(c.share * 100).toFixed(2)} %, letters ${got} px wide from ${c.x0} (drawn ${Math.round(want)} from ${Math.round(d.x0 * sx)}), centre ${(centre * 100).toFixed(1)} %`);
                if (!(c.share > 0.0005)) return fail(`${k}: the words are not in the file in their seconds`);
                if (Math.abs(centre - 0.5) > 0.04) return fail(`${k}: not in the middle`);
                if (Math.abs(got - want) / want > 0.08) return fail(`${k}: not as wide as drawn (soft, or another face)`);
                if (shift > 0.01) return fail(`${k}: not where it was drawn`);
              }
              const none = cream(file, 15.5, W, H);
              if (none.share > 0.0005) return fail('light letters where no template is');
              await b.close();
              console.log('PASSED');
            } catch (e) { await fail(e && e.stack || e); }
          })();
          JS
          PP="$(cygpath -w "$HOME/pp/node_modules/puppeteer-core")" CHROME="$(cygpath -w "$B")" URL="$URL" VIDEO="$(cygpath -w "$HOME/tpl16.mp4")" NAME='قوالب الكتابة' MCP="$(cygpath -w "$HOME/Documents/video-edit/studio/app/studio/tools/studio-mcp.mjs")" PYTHONIOENCODING=utf-8 node "$(cygpath -w "$HOME/templates_check.cjs")" || { taskkill //F //IM chrome.exe >/dev/null 2>&1; exit 1; }
          taskkill //F //IM chrome.exe >/dev/null 2>&1 || true
      - name: the encode check tells a cleaner neighbour from an offset (hotfix after 1.0.24) — the rows of the export above, then the installed studio's encodeCheck on this machine's ffmpeg — the same picture beside frame n encoded cleaner passes, a one-frame offset of moving content still fails, no neighbour pictures keeps the old rule, a picture repeated on one side hides no offset (1.0.25)
