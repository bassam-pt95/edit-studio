          TITLE='Ali’s vlog'
          PAGE="$(VIDEO="$(cygpath -w "$HOME/clip-test.mp4")" URL="$URL" TITLE="$TITLE" PYTHONIOENCODING=utf-8 python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          url = os.environ['URL'].rstrip('/')
          def call(path, body=None):
