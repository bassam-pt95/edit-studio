          B="$(bash -c ". '$S/_common.sh'; app_browser_win")"
          [ -d "$HOME/pp/node_modules/puppeteer-core" ] || npm install --prefix "$HOME/pp" --no-save --no-audit --no-fund puppeteer-core@25.11.0 >/dev/null
          ffmpeg -nostdin -v error -y -f lavfi -i "color=c=black:s=360x640:r=30:d=35,format=yuv420p,geq=lum='clip(T*7\,0\,255)':cb=128:cr=128" -f lavfi -i "sine=f=330:d=35" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$HOME/ramp35.mp4"
          cat > "$HOME/export_check.cjs" <<'JS'
          // P1 (audit 1.0.19) and the export case of P8: the studio's main output on this machine, made the way he makes it. The
          // studio as installed, in Chrome driven by puppeteer-core: a 35 s clip whose picture gets brighter every second (and a tone)
          // becomes a clip; «اعكسه» (over 30 s: the HEVC copy) and «السرعة» → 0.5× from the clip's own menu; a drawing through the
          // studio's own tool (studio-mcp.mjs draw, as Claude calls it); «تصدير» pressed in the page, and closing the window while it
          // runs asks. Then the file itself: every frame, as long as the timeline, its sound heard, the drawing in its seconds and
          // nowhere else, and the picture running backwards at half speed (the brightness of each second read back).
          // env: PP (puppeteer-core's folder), CHROME, URL (the running studio), VIDEO (the clip), NAME (its name), MCP (studio-mcp.mjs),
          // STEPS (what is done to the clip before the export: 'reverse,speed,draw' when not given)
          const pptr = require(process.env.PP);
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawn, spawnSync } = require('node:child_process');

          const url = process.env.URL.replace(/\/+$/, '');
          const STEPS = (process.env.STEPS || 'reverse,speed,draw').split(',');
          const srcDur = Number(spawnSync('ffprobe', ['-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', process.env.VIDEO], { encoding: 'utf8' }).stdout);
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const secs = (t0) => Math.round((Date.now() - t0) / 1000);
          const call = async (p, body, method) => {
            const r = await fetch(url + p, { method: method || (body === undefined ? 'GET' : 'POST'), headers: { 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
            return { status: r.status, body: await r.json().catch(() => ({})) };
          };
          async function until(fn, ms, what) {
            const t0 = Date.now();
            for (let last = 0; ; await sleep(500)) {
              const v = await fn();
              if (v) return v;
              if (Date.now() - t0 > ms) throw new Error(`${what}: not in ${Math.round(ms / 1000)} s`);
              if (Date.now() - last > 30000) { last = Date.now(); console.log(`  … ${what}: ${secs(t0)} s`); }
            }
          }

          // the studio's tool server, spoken to the way Claude Code speaks to it (JSON-RPC lines on its stdin)
          function tools(env) {
            const c = spawn(process.execPath, [process.env.MCP], { env: { ...process.env, ...env }, stdio: ['pipe', 'pipe', 'pipe'] });
            let buf = '', id = 0, err = '';
            const waiters = new Map();
            c.stderr.on('data', (d) => { err += d; });
            c.stdout.on('data', (d) => {
              buf += d;
              for (let i = buf.indexOf('\n'); i >= 0; i = buf.indexOf('\n')) {
                const line = buf.slice(0, i); buf = buf.slice(i + 1);
                let m = null;
                try { m = JSON.parse(line); } catch { continue; }
                const w = waiters.get(m.id);
                if (w) { waiters.delete(m.id); w(m); }
              }
            });
            const rpc = (method, params) => new Promise((r) => { id += 1; waiters.set(id, r); c.stdin.write(`${JSON.stringify({ jsonrpc: '2.0', id, method, params })}\n`); });
            return {
              hello: () => rpc('initialize', { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'windows-check', version: '0' } }),
              async call(name, args) {
                const r = await rpc('tools/call', { name, arguments: args });
                const content = (r.result && r.result.content) || [];
                return { text: content.filter((x) => x.type === 'text').map((x) => x.text).join('\n'), isError: !!(r.result && r.result.isError), log: err.slice(-800) };
              },
              stop: () => c.kill(),
            };
          }

          // one frame of the file at `t` seconds: [mean luma of a corner box, share of strongly red pixels]
          function frameAt(file, t, W, H) {
            const rgb = spawnSync('ffmpeg', ['-v', 'error', '-ss', t.toFixed(3), '-i', file, '-frames:v', '1', '-f', 'rawvideo', '-pix_fmt', 'rgb24', '-'], { maxBuffer: 64 << 20 }).stdout;
            if (!rgb || rgb.length < W * H * 3) throw new Error(`no frame at ${t} s`);
            let red = 0, y = 0, n = 0;
            for (let i = 0; i < W * H; i++) {
              const r = rgb[i * 3], g = rgb[i * 3 + 1], b = rgb[i * 3 + 2];
              if (r > 150 && g < 90 && b < 90) red++;
              const px = i % W, py = (i / W) | 0;
              if (px < W / 8 && py < H / 8) { y += 0.2126 * r + 0.7152 * g + 0.0722 * b; n++; }     // the corner the drawing never reaches
            }
            return [y / n, red / (W * H)];
          }

          (async () => {
            // the graphics card the runner has (Windows' software one) allowed, as the studio's own hidden page allows it (look-page.mjs)
            // (run 41478240120, the Arabic user folder: on Windows puppeteer calls any failed start «already running» and says no more)
            // its own profile folder, two minutes to start on a busy runner, and the browser's own words in the log
            const prof = fs.mkdtempSync(path.join(require('node:os').tmpdir(), 'export-chrome-'));
            // CHROME_HOME (the Arabic user folder step, run 41487587106): HOME and USERPROFILE are swapped there by variables only, while
            // Windows' own profile stays the runner's, and Chrome then takes its folder for the default one («DevTools remote debugging
            // requires a non-default data directory»). On a real machine the two agree, so the test's browser gets the runner's
            // own; the studio, its data, the clip and the export stay under the Arabic folder
            const own = process.env.CHROME_HOME ? { USERPROFILE: process.env.CHROME_HOME, HOME: process.env.CHROME_HOME } : {};
            const b = await pptr.launch({ executablePath: process.env.CHROME, headless: true, userDataDir: prof, dumpio: true, timeout: 120000,
              env: { ...process.env, ...own }, args: ['--no-first-run', '--no-default-browser-check', '--ignore-gpu-blocklist'] });
            const fail = async (why) => { console.error('FAILED:', why); await b.close().catch(() => {}); process.exit(1); };
            try {
              // 1 the clip
              const st = await call('/api/raw/start', { path: process.env.VIDEO, name: process.env.NAME, mode: 'manual', face: 'none' });
              console.log('start', st.status, JSON.stringify(st.body));
              if (st.status !== 202 || !st.body.folder) return fail('the clip did not start');
              const folder = st.body.folder, x = `/x/${encodeURIComponent(folder)}`;
              await until(async () => { const l = (await call('/api/projects')).body; const e = (l.projects || []).find((p) => p.folder === folder); return e && e.status !== 'preparing' && e.phase !== 'running'; }, 300000, 'the clip ready');
              const dir = path.join((await call('/api/info')).body.root, folder);
              console.log('the clip:', dir);

              // 2 its page
              const page = await b.newPage();
              // puppeteer keeps every request it sees: the export's frames (8 MB each) would fill its memory (the e2e harness does the same)
