          p = pr['project']
          assert [c['asset'] for c in p['spine']] == ['a_src', 'a_src2'], p['spine']
          assert p['meta'].get('noSpeech') == ['a_src2'], p['meta']
          assert not p['assets']['a_src']['audio'].get('silence') and any(pcm(f2, p['assets']['a_src']['audio']['pcm'], 3)), 'the camera keeps its own sound'
          assert p['assets']['a_src2']['audio'].get('silence') is True and not any(pcm(f2, p['assets']['a_src2']['audio']['pcm'], 4))
